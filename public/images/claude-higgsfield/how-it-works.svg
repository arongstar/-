    <text x="353" y="116" font-size="14" fill="#5d655f">기획·작가·감독</text>
    <g font-size="14" fill="#1f2421"><text x="353" y="150">수업 목표 → 장면 구성</text><text x="353" y="174">대본·나레이션 쓰기</text><text x="353" y="198">프롬프트 다듬기</text><text x="353" y="222">예상 크레딧 계산</text></g>

    <rect x="512" y="105" width="120" height="90" rx="45" fill="#2f6f5e"/>

    <line x1="460" y1="150" x2="508" y2="150" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="634" y1="150" x2="682" y2="150" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text x="480" y="282" text-anchor="middle" font-size="14" fill="#5d655f">Claude 대화창에서 말로 시키면, Claude가 힉스필드 도구를 불러 이미지·영상을 만들어 돌려줘요</text>

    <text x="811" y="116" font-size="14" fill="#5d655f">촬영·그림 스튜디오</text>
    <g font-size="14" fill="#1f2421"><text x="811" y="150">이미지 생성 (캐릭터·포스터)</text><text x="811" y="174">영상 생성 (여러 AI 모델)</text><text x="811" y="198">한국어 나레이션·목소리</text><text x="811" y="222">크레딧 차감</text></g>
  </g>
  <g stroke="#5d655f" stroke-width="2.5" fill="none">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d655f"/></marker></defs>
  <rect width="960" height="300" rx="18" fill="#fbfaf6"/>
  <g text-anchor="middle">
    <rect x="24" y="70" width="170" height="160" rx="16" fill="#ffffff" stroke="#e2e0d8" stroke-width="2"/>
    <text x="109" y="122" font-size="36">👨‍🏫</text>
    <text x="109" y="160" font-size="20" font-weight="800" fill="#1f2421">선생님</text>
    <text x="109" y="186" font-size="14" fill="#5d655f">"이런 영상이</text><text x="109" y="206" font-size="14" fill="#5d655f">필요해요"</text>

    <rect x="248" y="50" width="210" height="200" rx="16" fill="#ffffff" stroke="#c96442" stroke-width="2.5"/>

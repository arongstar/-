<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 384" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/></marker></defs>
<rect width="980" height="384" rx="18" fill="#fbfaf6"/>
<text x="490" y="40" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">과제로 과정 중심 평가하기</text><rect x="20" y="66" width="172" height="178" rx="16" fill="#e3edfb"/><circle cx="106.0" cy="100" r="19" fill="#2b5fb4"/><text x="106.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text><text x="106.0" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#2b5fb4">과제 만들기</text><text x="106.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">제목에 성취기준</text><text x="106.0" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">코드를 붙여 두기</text><path d="M194,155 L209,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="211" y="66" width="172" height="178" rx="16" fill="#e3f0eb"/><circle cx="297.0" cy="100" r="19" fill="#2f6f5e"/><text x="297.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text><text x="297.0" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#2f6f5e">학생 제출</text><text x="297.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">제출 · 평가 대기</text><text x="297.0" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">· 미제출로 나뉨</text><path d="M385,155 L400,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="402" y="66" width="172" height="178" rx="16" fill="#fdeee3"/><circle cx="488.0" cy="100" r="19" fill="#c45f2a"/><text x="488.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text><text x="488.0" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#c45f2a">평가·피드백</text><text x="488.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">점수 + 한 줄 의견</text><text x="488.0" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">필요하면 다시 제출</text><path d="M576,155 L591,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="593" y="66" width="172" height="178" rx="16" fill="#f1ecf8"/><circle cx="679.0" cy="100" r="19" fill="#6a4fa3"/><text x="679.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text><text x="679.0" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#6a4fa3">고쳐서 다시 제출</text><text x="679.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">평가 상태에</text><text x="679.0" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">고친 기록이 쌓임</text><path d="M767,155 L782,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="784" y="66" width="172" height="178" rx="16" fill="#e5f4f6"/><circle cx="870.0" cy="100" r="19" fill="#1f7f8c"/><text x="870.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">5</text><text x="870.0" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#1f7f8c">성적 탭</text><text x="870.0" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">과목 · 학생 이름</text><text x="870.0" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">검색으로 모아 보기</text><path d="M679.0,248 C679.0,290 488.0,290 488.0,252" stroke="#c45f2a" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="583.5" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#c45f2a">고칠 점이 있으면 한 번 더</text><rect x="250" y="324" width="480" height="40" rx="20" fill="#1c2540"/><text x="490" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">쌓인 점수와 기록 → 학생 성장 관찰 · 생활기록부 참고 자료</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/></marker></defs>
<rect width="980" height="372" rx="18" fill="#fbfaf6"/>
<text x="490" y="40" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">웨일 클래스는 이렇게 생겼어요</text><rect x="30" y="66" width="200" height="252" rx="16" fill="#e3edfb"/><text x="130" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#2b5fb4">클래스</text><text x="130" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">우리 반 한 개</text><rect x="46" y="146" width="168" height="44" rx="10" fill="#fff" stroke="#2b5fb4" stroke-width="2"/><text x="130" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">○학년 ○반</text><rect x="46" y="202" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="130" y="227" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">클래스 홈</text><rect x="46" y="254" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="130" y="279" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">설정 · 성적 · 통계</text><path d="M234,168 L266,168" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="270" y="66" width="200" height="252" rx="16" fill="#e3f0eb"/><text x="370" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#2f6f5e">메뉴(게시판)</text><text x="370" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">과목마다 하나</text><rect x="286" y="146" width="168" height="44" rx="10" fill="#fff" stroke="#2f6f5e" stroke-width="2"/><text x="370" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">수학 (챕터형 게시판)</text><rect x="286" y="202" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="370" y="227" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">공지 게시판</text><rect x="286" y="254" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="370" y="279" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">토론 게시판</text><path d="M474,168 L506,168" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="510" y="66" width="200" height="252" rx="16" fill="#fdeee3"/><text x="610" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#c45f2a">챕터</text><text x="610" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">단원마다 하나</text><rect x="526" y="146" width="168" height="44" rx="10" fill="#fff" stroke="#c45f2a" stroke-width="2"/><text x="610" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">3단원 (배우는 중)</text><rect x="526" y="202" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="610" y="227" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">4단원 (다음 단원)</text><rect x="526" y="254" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="610" y="279" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">끝난 단원은 비공개</text><path d="M714,168 L746,168" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="750" y="66" width="200" height="252" rx="16" fill="#f1ecf8"/><text x="850" y="104" text-anchor="middle" font-size="20" font-weight="800" fill="#6a4fa3">수업 콘텐츠</text><text x="850" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">차시마다</text><rect x="766" y="146" width="168" height="44" rx="10" fill="#fff" stroke="#6a4fa3" stroke-width="2"/><text x="850" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">1차시 수업</text><rect x="766" y="202" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="850" y="227" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">퀴즈 · 과제</text><rect x="766" y="254" width="168" height="40" rx="10" fill="#ffffffaa"/><text x="850" y="279" text-anchor="middle" font-size="13" font-weight="400" fill="#3d4456">동료평가 · 퀴즈형 설문</text><text x="490" y="350" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">메뉴는 [설정 › 메뉴 관리], 챕터와 수업은 각 게시판에서 [챕터 추가] · [수업 추가]</text></svg>
<text x="490" y="42" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">계정 하나로 쓰는 웨일 스페이스</text><rect x="330" y="68" width="320" height="64" rx="32" fill="#2b5fb4"/><text x="490" y="98" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">웨일 스페이스 계정</text><text x="490" y="120" text-anchor="middle" font-size="13" font-weight="400" fill="#dbe6fb">교육청·학교에서 받은 아이디</text><path d="M490,132 L112.0,176" stroke="#c7ccd6" stroke-width="2" fill="none"/><rect x="24" y="180" width="176" height="132" rx="16" fill="#e3edfb" stroke="#2b5fb4" stroke-width="3"/><text x="112.0" y="222" text-anchor="middle" font-size="19" font-weight="800" fill="#2b5fb4">웨일 클래스</text><text x="112.0" y="254" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">수업·퀴즈·과제·평가</text><text x="112.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">오늘 배울 것</text><path d="M490,132 L300.0,176" stroke="#c7ccd6" stroke-width="2" fill="none"/><rect x="212" y="180" width="176" height="132" rx="16" fill="#e3f0eb"/><text x="300.0" y="222" text-anchor="middle" font-size="19" font-weight="800" fill="#2f6f5e">팀보드</text><text x="300.0" y="254" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">함께 쓰는 화이트보드</text><text x="300.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">클래스 전용 보드</text><path d="M490,132 L488.0,176" stroke="#c7ccd6" stroke-width="2" fill="none"/><rect x="400" y="180" width="176" height="132" rx="16" fill="#e5f4f6"/><text x="488.0" y="222" text-anchor="middle" font-size="19" font-weight="800" fill="#1f7f8c">웨일온</text><text x="488.0" y="254" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">설치 없는 화상 수업</text><text x="488.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">클래스 전용 회의실</text><path d="M490,132 L676.0,176" stroke="#c7ccd6" stroke-width="2" fill="none"/><rect x="588" y="180" width="176" height="132" rx="16" fill="#f1ecf8"/><text x="676.0" y="222" text-anchor="middle" font-size="19" font-weight="800" fill="#6a4fa3">네이버 웍스</text><text x="676.0" y="254" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">메신저·메일·드라이브</text><text x="676.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">교사·학급 소통</text><path d="M490,132 L864.0,176" stroke="#c7ccd6" stroke-width="2" fill="none"/><rect x="776" y="180" width="176" height="132" rx="16" fill="#fdeee3"/><text x="864.0" y="222" text-anchor="middle" font-size="19" font-weight="800" fill="#c45f2a">웨일 브라우저</text><text x="864.0" y="254" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">로그인·집중 모드</text><text x="864.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7183">관리자 정책 적용</text><text x="490" y="348" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">+ 웨일북(학생 기기) · 웨일 UBT(디지털 평가)도 같은 계정으로 이어져요</text></svg>
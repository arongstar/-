<text x="490" y="42" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">일 잘 시키는 문장 = 네 조각</text><rect x="20" y="70" width="220" height="104" rx="16" fill="#e3f0eb"/><text x="130.0" y="110" text-anchor="middle" font-size="21" font-weight="800" fill="#2f6f5e">어디서</text><text x="130.0" y="142" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">사이트 · 파일 · 폴더</text><text x="250.0" y="128" text-anchor="middle" font-size="24" font-weight="800" fill="#8a8f9c">+</text><rect x="20" y="196" width="220" height="58" rx="12" fill="#fff" stroke="#2f6f5e" stroke-width="2"/><text x="130.0" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">국립경주박물관 누리집에서</text><rect x="260" y="70" width="220" height="104" rx="16" fill="#fdeee3"/><text x="370.0" y="110" text-anchor="middle" font-size="21" font-weight="800" fill="#c45f2a">무엇을</text><text x="370.0" y="142" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">찾을 정보 · 할 일</text><text x="490.0" y="128" text-anchor="middle" font-size="24" font-weight="800" fill="#8a8f9c">+</text><rect x="260" y="196" width="220" height="58" rx="12" fill="#fff" stroke="#c45f2a" stroke-width="2"/><text x="370.0" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">단체 관람 시간과 휴관일을 찾아</text><rect x="500" y="70" width="220" height="104" rx="16" fill="#e3edfb"/><text x="610.0" y="110" text-anchor="middle" font-size="21" font-weight="800" fill="#2b5fb4">어떤 모양</text><text x="610.0" y="142" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">표 · 엑셀 · 5줄</text><text x="730.0" y="128" text-anchor="middle" font-size="24" font-weight="800" fill="#8a8f9c">+</text><rect x="500" y="196" width="220" height="58" rx="12" fill="#fff" stroke="#2b5fb4" stroke-width="2"/><text x="610.0" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">표로 정리하고 출처 주소도</text><rect x="740" y="70" width="220" height="104" rx="16" fill="#f1ecf8"/><text x="850.0" y="110" text-anchor="middle" font-size="21" font-weight="800" fill="#6a4fa3">멈출 곳</text><text x="850.0" y="142" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">하지 말 일</text><rect x="740" y="196" width="220" height="58" rx="12" fill="#fff" stroke="#6a4fa3" stroke-width="2"/><text x="850.0" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2540">예약 신청은 하지 마</text><text x="490" y="292" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">“일 좀 해 줘”처럼 막연하면 엉뚱한 곳으로 가요 · 돈 · 개인정보 · 보내기가 걸린 일은 멈출 곳을 꼭 적어요</text></svg>
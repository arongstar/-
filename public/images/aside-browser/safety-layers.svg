<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/></marker></defs>
<rect width="980" height="400" rx="18" fill="#fbfaf6"/>
<text x="490" y="42" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">Aside의 안전장치 세 겹 + 사람의 약속</text><rect x="24" y="70" width="932" height="72" rx="14" fill="#e3f0eb"/><circle cx="62" cy="106" r="18" fill="#2f6f5e"/><text x="62" y="113" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text><text x="96" y="101" text-anchor="start" font-size="19" font-weight="800" fill="#2f6f5e">작업 권한</text><text x="96" y="125" text-anchor="start" font-size="13" font-weight="400" fill="#6b7183">파일을 어디까지 만질까</text><text x="330" y="112" text-anchor="start" font-size="15" font-weight="700" fill="#1c2540">Read only · Guard(기본) · Full access</text><text x="936" y="112" text-anchor="end" font-size="14" font-weight="400" fill="#3d4456">Guard로 두고 작업 폴더만 지정</text><rect x="24" y="156" width="932" height="72" rx="14" fill="#fdeee3"/><circle cx="62" cy="192" r="18" fill="#c45f2a"/><text x="62" y="199" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text><text x="96" y="187" text-anchor="start" font-size="19" font-weight="800" fill="#c45f2a">비밀번호 금고</text><text x="96" y="211" text-anchor="start" font-size="13" font-weight="400" fill="#6b7183">AI는 비밀번호를 못 봐요</text><text x="330" y="198" text-anchor="start" font-size="15" font-weight="700" fill="#1c2540">Always allow · While unlocked · Never</text><text x="936" y="198" text-anchor="end" font-size="14" font-weight="400" fill="#3d4456">While unlocked 또는 Never</text><rect x="24" y="242" width="932" height="72" rx="14" fill="#e3edfb"/><circle cx="62" cy="278" r="18" fill="#2b5fb4"/><text x="62" y="285" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text><text x="96" y="273" text-anchor="start" font-size="19" font-weight="800" fill="#2b5fb4">승인 기다리기</text><text x="96" y="297" text-anchor="start" font-size="13" font-weight="400" fill="#6b7183">보내기 · 결제 · 게시 전에</text><text x="330" y="284" text-anchor="start" font-size="15" font-weight="700" fill="#1c2540">작업이 멈추고 확인을 기다려요</text><text x="936" y="284" text-anchor="end" font-size="14" font-weight="400" fill="#3d4456">승인 전에 화면을 꼭 읽기</text><rect x="24" y="334" width="932" height="50" rx="14" fill="#1c2540"/><text x="490" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">사람의 약속: 나이스 · 업무포털 · 은행 · 학생 정보 화면에는 맡기지 않아요</text></svg>
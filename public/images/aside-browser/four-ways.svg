<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/></marker></defs>
<rect width="980" height="320" rx="18" fill="#fbfaf6"/>
<text x="490" y="42" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">Aside에게 일 시키는 네 가지 방법</text><rect x="22" y="70" width="214" height="170" rx="16" fill="#e3f0eb"/><circle cx="129.0" cy="104" r="19" fill="#2f6f5e"/><text x="129.0" y="111" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text><text x="129.0" y="154" text-anchor="middle" font-size="20" font-weight="800" fill="#2f6f5e">글자 고르기</text><text x="129.0" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2540">한 문단</text><text x="129.0" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">드래그 → 요약 · 번역</text><path d="M239,155 L257,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="260" y="70" width="214" height="170" rx="16" fill="#fdeee3"/><circle cx="367.0" cy="104" r="19" fill="#c45f2a"/><text x="367.0" y="111" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text><text x="367.0" y="154" text-anchor="middle" font-size="20" font-weight="800" fill="#c45f2a">사이드 패널</text><text x="367.0" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2540">지금 보는 페이지</text><text x="367.0" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">페이지를 붙여 일 시키기</text><path d="M477,155 L495,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="498" y="70" width="214" height="170" rx="16" fill="#e3edfb"/><circle cx="605.0" cy="104" r="19" fill="#2b5fb4"/><text x="605.0" y="111" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text><text x="605.0" y="154" text-anchor="middle" font-size="20" font-weight="800" fill="#2b5fb4">작업 (Task)</text><text x="605.0" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2540">여러 사이트 · 파일</text><text x="605.0" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">조사 · 표 · 파일 만들기</text><path d="M715,155 L733,155" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/><rect x="736" y="70" width="214" height="170" rx="16" fill="#f1ecf8"/><circle cx="843.0" cy="104" r="19" fill="#6a4fa3"/><text x="843.0" y="111" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text><text x="843.0" y="154" text-anchor="middle" font-size="20" font-weight="800" fill="#6a4fa3">루틴</text><text x="843.0" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2540">정해진 때 저절로</text><text x="843.0" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">매주 월요일 아침 요약</text><path d="M40,272 L940,272" stroke="#c7ccd6" stroke-width="3" marker-end="url(#a)"/><text x="40" y="300" text-anchor="start" font-size="14" font-weight="700" fill="#6b7183">작은 일</text><text x="940" y="300" text-anchor="end" font-size="14" font-weight="700" fill="#6b7183">큰 일 · 반복하는 일</text></svg>
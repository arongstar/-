<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><rect width="980" height="322" rx="18" fill="#fbfaf6"/><text x="490" y="42" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">피클에게 일을 맡기면 이렇게 흘러가요</text><rect x="20" y="66" width="172" height="170" rx="16" fill="#e3f0eb"/><circle cx="106.0" cy="100" r="19" fill="#2f6f5e"/><text x="106.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text><text x="106.0" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#2f6f5e">말로 부탁</text><text x="106.0" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">평소 말하듯</text><text x="106.0" y="204" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">채팅 · 음성 통화</text><path d="M194,150 L209,150" stroke="#8a8f9c" stroke-width="3"/><rect x="211" y="66" width="172" height="170" rx="16" fill="#fff6d6"/><circle cx="297.0" cy="100" r="19" fill="#8a6d00"/><text x="297.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text><text x="297.0" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#8a6d00">필요한 것만 질문</text><text x="297.0" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">인원 · 날짜 · 고를 것</text><text x="297.0" y="204" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">선택지를 보여 줘요</text><path d="M385,150 L400,150" stroke="#8a8f9c" stroke-width="3"/><rect x="402" y="66" width="172" height="170" rx="16" fill="#fdeee3"/><circle cx="488.0" cy="100" r="19" fill="#c45f2a"/><text x="488.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text><text x="488.0" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#c45f2a">확인 카드</text><text x="488.0" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">무엇을 · 얼마에</text><text x="488.0" y="204" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">승인 / 거절 버튼</text><path d="M576,150 L591,150" stroke="#8a8f9c" stroke-width="3"/><rect x="593" y="66" width="172" height="170" rx="16" fill="#e3edfb"/><circle cx="679.0" cy="100" r="19" fill="#2b5fb4"/><text x="679.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text><text x="679.0" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#2b5fb4">작업 카드</text><text x="679.0" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">진행 상황 보기</text><text x="679.0" y="204" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">앱을 닫아도 계속</text><path d="M767,150 L782,150" stroke="#8a8f9c" stroke-width="3"/><rect x="784" y="66" width="172" height="170" rx="16" fill="#f1ecf8"/><circle cx="870.0" cy="100" r="19" fill="#6a4fa3"/><text x="870.0" y="107" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">5</text><text x="870.0" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#6a4fa3">결과 알림</text><text x="870.0" y="180" text-anchor="middle" font-size="14" font-weight="400" fill="#3d4456">예약 확인 링크</text><text x="870.0" y="204" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">전화 기록은 다른 대화</text><rect x="150" y="258" width="680" height="44" rx="22" fill="#1c2540"/><text x="490" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">금액이 오르거나 시간이 바뀌면 다시 물어봐요 · 결제는 내가 승인한 만큼만</text></svg>
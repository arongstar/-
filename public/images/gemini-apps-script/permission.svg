<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif"><rect x="0" y="0" width="960" height="600" rx="12" fill="#ffffff" stroke="#c7ccd4" stroke-width="2" /><rect x="1" y="1" width="958" height="40" rx="11" fill="#eef1f5"/><circle cx="20" cy="21" r="6" fill="#ff5f57"/><circle cx="38" cy="21" r="6" fill="#febc2e"/><circle cx="56" cy="21" r="6" fill="#28c840"/><rect x="78" y="9" width="300" height="24" rx="8" fill="#fff" stroke="#dfe3e8" stroke-width="1.5" /><text x="92" y="26" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Google 계정으로 로그인</text><rect x="20" y="70" width="290" height="500" rx="12" fill="#fff" stroke="#dadce0" stroke-width="1.5" /><text x="40" y="112" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">승인 필요</text><text x="40" y="150" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">이 프로젝트에서 내 데이터에</text><text x="40" y="176" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">액세스하려면 권한이 필요해요.</text><rect x="170" y="500" width="120" height="34" rx="17" fill="#1a73e8" stroke="#1a73e8" stroke-width="1.5" /><text x="230.0" y="522.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">권한 검토</text><rect x="335" y="70" width="290" height="500" rx="12" fill="#fff" stroke="#dadce0" stroke-width="1.5" /><text x="355" y="112" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Google에서 확인하지 않은 앱</text><text x="355" y="150" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">이 앱은 Google에서</text><text x="355" y="176" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">확인하지 않았어요.</text><text x="355" y="202" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start"></text><text x="355" y="228" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">▾ 고급</text><rect x="355" y="500" width="250" height="34" rx="17" fill="#1a73e8" stroke="#1a73e8" stroke-width="1.5" /><text x="480.0" y="522.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">안전한 페이지로 돌아가기</text><text x="355" y="286" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="start">우리 반 퀴즈(으)로 이동(안전하지 않음)</text><line x1="355" y1="292" x2="620" y2="292" stroke="#1a73e8"/><rect x="650" y="70" width="290" height="500" rx="12" fill="#fff" stroke="#dadce0" stroke-width="1.5" /><text x="670" y="112" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">우리 반 퀴즈 앱이</text><text x="670" y="150" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">내 Google 계정에 액세스하려고</text><text x="670" y="176" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">해요.</text><text x="670" y="202" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start"></text><text x="670" y="228" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">· 스프레드시트 보기·수정</text><text x="670" y="254" font-size="14" font-weight="400" fill="#3c4043" text-anchor="start">· 외부 서비스에 연결</text><rect x="690" y="500" width="100" height="34" rx="17" fill="#fff" stroke="#1a73e8" stroke-width="1.5" /><text x="740.0" y="522.0" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="middle">취소</text><rect x="810" y="500" width="110" height="34" rx="17" fill="#1a73e8" stroke="#1a73e8" stroke-width="1.5" /><text x="865.0" y="522.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">허용</text></svg>
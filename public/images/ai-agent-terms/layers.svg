<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/></marker></defs><rect width="980" height="440" rx="18" fill="#fbfaf6"/><text x="490" y="40" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2540">AI 도구는 이렇게 쌓여 있어요</text><rect x="40.0" y="64" width="900" height="50" rx="12" fill="#f1ecf8"/><text x="60.0" y="96" text-anchor="start" font-size="17" font-weight="800" fill="#6a4fa3">일하는 곳</text><text x="180.0" y="96" text-anchor="start" font-size="15" font-weight="500" fill="#1c2540">채팅 앱 · 브라우저(크롬 확장) · 명령창(CLI)</text><text x="922.0" y="96" text-anchor="end" font-size="13" font-weight="400" fill="#6b7183">어디서 시킬까</text><rect x="52.0" y="122" width="876" height="50" rx="12" fill="#fdeee3"/><text x="72.0" y="154" text-anchor="start" font-size="17" font-weight="800" fill="#c45f2a">묶음</text><text x="192.0" y="154" text-anchor="start" font-size="15" font-weight="500" fill="#1c2540">플러그인 = 스킬 + 커넥터 + 명령을 한 상자에</text><text x="910.0" y="154" text-anchor="end" font-size="13" font-weight="400" fill="#6b7183">한 번에 설치</text><rect x="64.0" y="180" width="852" height="50" rx="12" fill="#e3edfb"/><text x="84.0" y="212" text-anchor="start" font-size="17" font-weight="800" fill="#2b5fb4">밖과 연결</text><text x="204.0" y="212" text-anchor="start" font-size="15" font-weight="500" fill="#1c2540">커넥터 (메일 · 캘린더 · 드라이브) ← MCP라는 공통 규격</text><text x="898.0" y="212" text-anchor="end" font-size="13" font-weight="400" fill="#6b7183">무엇을 볼 수 있나</text><rect x="76.0" y="238" width="828" height="50" rx="12" fill="#e3f0eb"/><text x="96.0" y="270" text-anchor="start" font-size="17" font-weight="800" fill="#2f6f5e">일 잘하게</text><text x="216.0" y="270" text-anchor="start" font-size="15" font-weight="500" fill="#1c2540">스킬(업무 매뉴얼) · 메모리 · 프로젝트</text><text x="886.0" y="270" text-anchor="end" font-size="13" font-weight="400" fill="#6b7183">어떻게 일할까</text><rect x="88.0" y="296" width="804" height="50" rx="12" fill="#fff6d6"/><text x="108.0" y="328" text-anchor="start" font-size="17" font-weight="800" fill="#8a6d00">앱</text><text x="228.0" y="328" text-anchor="start" font-size="15" font-weight="500" fill="#1c2540">제미나이 앱 · 챗GPT 앱 · 클로드 앱</text><text x="874.0" y="328" text-anchor="end" font-size="13" font-weight="400" fill="#6b7183">자동차</text><rect x="100.0" y="354" width="780" height="50" rx="12" fill="#e8eaf0"/><text x="120.0" y="386" text-anchor="start" font-size="17" font-weight="800" fill="#1c2540">모델</text><text x="240.0" y="386" text-anchor="start" font-size="15" font-weight="500" fill="#1c2540">Gemini · GPT · Claude 모델 (AI의 두뇌)</text><text x="862.0" y="386" text-anchor="end" font-size="13" font-weight="400" fill="#6b7183">엔진</text><text x="490" y="422" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7183">아래층일수록 기본, 위층일수록 “일을 맡기는” 기능이에요</text></svg>
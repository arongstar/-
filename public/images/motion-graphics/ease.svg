<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><rect width="980" height="470" rx="18" fill="#fbfaf6"/><text x="490.0" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2421">같은 1초, 다른 느낌 — 공이 어디쯤 있는지 0.1초마다 찍어 봤어요</text><text x="60" y="95" text-anchor="start" font-size="17" font-weight="800" fill="#8a8f9c">일정한 속도 (linear)</text><text x="60" y="117" text-anchor="start" font-size="14" font-weight="500" fill="#4f5751">로봇처럼 딱딱해요</text><line x1="130" y1="157" x2="880" y2="157" stroke="#d9d6cc" stroke-width="3" stroke-linecap="round"/><circle cx="130.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.25"/><circle cx="205.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.33"/><circle cx="280.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.40"/><circle cx="355.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.47"/><circle cx="430.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.55"/><circle cx="505.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.62"/><circle cx="580.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.70"/><circle cx="655.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.77"/><circle cx="730.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.85"/><circle cx="805.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="0.93"/><circle cx="880.0" cy="157" r="12" fill="#8a8f9c" fill-opacity="1.00"/><text x="100" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#4f5751">출발</text><text x="920" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#4f5751">도착</text><text x="60" y="205" text-anchor="start" font-size="17" font-weight="800" fill="#3e7b3a">들어올 때 · 빠르게 와서 천천히 멈춤 (expo.out)</text><text x="60" y="227" text-anchor="start" font-size="14" font-weight="500" fill="#4f5751">“착!” 하고 자리 잡아요 — 등장에</text><line x1="130" y1="267" x2="880" y2="267" stroke="#d9d6cc" stroke-width="3" stroke-linecap="round"/><circle cx="
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/></marker>
  </defs>
  <rect width="980" height="300" rx="18" fill="#fbfaf6"/>
  <text x="490" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1c2540">수업 영상 만드는 5단계</text>

  <g>
    <rect x="20" y="70" width="168" height="190" rx="16" fill="#e3f0eb"/>
    <circle cx="104" cy="104" r="20" fill="#2f6f5e"/>
    <text x="104" y="111" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
    <text x="104" y="156" text-anchor="middle" font-size="19" font-weight="800" fill="#2f6f5e">목표 한 문장</text>
    <text x="104" y="190" text-anchor="middle" font-size="14" fill="#3d4456">학생이 알게 될 것</text>
    <text x="104" y="212" text-anchor="middle" font-size="14" fill="#3d4456">하나만 정하기</text>
  </g>
  <path d="M192,165 L212,165" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="216" y="70" width="168" height="190" rx="16" fill="#fdeee3"/>
    <circle cx="300" cy="104" r="20" fill="#e0713a"/>
    <text x="300" y="111" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
    <text x="300" y="156" text-anchor="middle" font-size="19" font-weight="800" fill="#c45a24">장면 설계</text>
    <text x="300" y="190" text-anchor="middle" font-size="14" fill="#3d4456">시간 · 화면 · 글자 표</text>
    <text x="300" y="212" text-anchor="middle" font-size="14" fill="#3d4456">장면마다 메시지 하나</text>
  </g>
  <path d="M388,165 L408,165" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="412" y="70" width="168" height="190" rx="16" fill="#e6eefb"/>
    <circle cx="496" cy="104" r="20" fill="#3a66c4"/>
    <text x="496" y="111" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
    <text x="496" y="156" text-anchor="middle" font-size="19" font-weight="800" fill="#2f55a8">클로드에게 요청</text>
    <text x="496" y="190" text-anchor="middle" font-size="14" fill="#3d4456">학년 · 길이 · 색 · 글꼴</text>
    <text x="496" y="212" text-anchor="middle" font-size="14" fill="#3d4456">계획 먼저 보여 달라기</text>
  </g>
  <path d="M584,165 L604,165" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="608" y="70" width="168" height="190" rx="16" fill="#f5e7f3"/>
    <circle cx="692" cy="104" r="20" fill="#9b4a9a"/>
    <text x="692" y="111" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>
    <text x="692" y="156" text-anchor="middle" font-size="19" font-weight="800" fill="#86398a">보고 말로 고치기</text>
    <text x="692" y="190" text-anchor="middle" font-size="14" fill="#3d4456">미리보기 · 장면 캡처</text>
    <text x="692" y="212" text-anchor="middle" font-size="14" fill="#3d4456">개념은 교사가 검토</text>
  </g>
  <path d="M780,165 L800,165" stroke="#8a8f9c" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="804" y="70" width="156" height="190" rx="16" fill="#1c2540"/>
    <circle cx="882" cy="104" r="20" fill="#ffcf4a"/>
    <text x="882" y="111" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2540">5</text>
    <text x="882" y="156" text-anchor="middle" font-size="19" font-weight="800" fill="#ffcf4a">MP4로 렌더링</text>
    <text x="882" y="190" text-anchor="middle" font-size="14" fill="#d7dbe6">교실 TV · 패들렛</text>
    <text x="882" y="212" text-anchor="middle" font-size="14" fill="#d7dbe6">수업에 바로 쓰기</text>
  </g>
</svg>

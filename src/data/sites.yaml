# 사이트 모음 — 여기에 항목을 추가하면 "사이트 모음" 페이지에 바로 나타납니다.
#
# id:          영문·숫자·하이픈으로 된 고유 이름 (교안에서 이 id로 연결)
# name:        화면에 보일 이름
# url:         사이트 주소 (https:// 로 시작)
# category:    분류 (같은 분류끼리 묶여서 보입니다)
# description: 한두 줄 소개
# use:         "교사용" 또는 "학생 활동 가능"
# note:        (선택) 주의할 점 — 노란 상자로 표시됩니다

- id: chatgpt
  name: ChatGPT
  url: https://chatgpt.com
  category: 대화형 AI
  description: 질문에 답하고 글을 쓰고 정리해 주는 대화형 AI. 수업 아이디어, 가정통신문, 평가 문항 초안 만들기에 좋아요.
  use: 교사용
  note: 가입 연령과 보호자 동의 기준이 있으니 학생 사용 전 약관을 확인하세요.

- id: gemini
  name: Gemini
  url: https://gemini.google.com
  category: 대화형 AI
  description: 구글의 대화형 AI. 구글 문서·드라이브 등 구글 서비스와 함께 쓰기 편해요.
  use: 교사용
  note: 학교 구글 워크스페이스 계정의 사용 허용 여부를 확인하세요.

- id: claude
  name: Claude
  url: https://claude.ai
  category: 대화형 AI
  description: 긴 문서 읽기와 글 다듬기에 강한 대화형 AI. 교육과정 문서나 연수 자료 요약에 활용해 보세요.
  use: 교사용

- id: copilot
  name: Microsoft Copilot
  url: https://copilot.microsoft.com
  category: 대화형 AI
  description: 마이크로소프트의 대화형 AI. 웹 검색 결과를 바탕으로 답해 주고 이미지도 만들 수 있어요.
  use: 교사용

- id: wrtn
  name: 뤼튼
  url: https://wrtn.ai
  category: 대화형 AI
  description: 한국어에 친숙한 AI 서비스. 다양한 목적별 도구를 한곳에서 써 볼 수 있어요.
  use: 교사용

- id: notebooklm
  name: NotebookLM
  url: https://notebooklm.google.com
  category: 자료 정리·요약
  description: 내가 올린 PDF·문서·영상만을 근거로 요약하고 질문에 답해 주는 AI 노트. 교육과정 해설서 정리에 유용해요.
  use: 교사용

- id: canva
  name: Canva
  url: https://www.canva.com
  category: 디자인·발표
  description: 템플릿으로 포스터, 카드뉴스, 활동지, 발표 자료를 쉽게 만드는 디자인 도구. AI 이미지 생성 기능도 있어요.
  use: 학생 활동 가능
  note: 교사 인증을 하면 교육용 기능을 무료로 쓸 수 있어요. 학생 계정은 교사가 수업(클래스)으로 초대해 관리하세요.

- id: miricanvas
  name: 미리캔버스
  url: https://www.miricanvas.com
  category: 디자인·발표
  description: 한국어 템플릿이 풍부한 디자인 도구. 안내장, 포스터, 상장 만들기에 편리해요.
  use: 교사용

- id: gamma
  name: Gamma
  url: https://gamma.app
  category: 디자인·발표
  description: 주제와 개요만 입력하면 AI가 발표 자료를 자동으로 만들어 줘요.
  use: 교사용

- id: padlet
  name: Padlet
  url: https://padlet.com
  category: 협업·소통
  description: 온라인 게시판에 학생들이 글·그림·사진을 함께 올리는 협업 도구. 생각 모으기 활동에 좋아요.
  use: 학생 활동 가능
  note: 무료 요금제는 만들 수 있는 보드 수가 제한돼요.

- id: tkbell
  name: 띵커벨
  url: https://www.tkbell.co.kr
  category: 퀴즈·평가
  description: 퀴즈, 토의·토론, 보드 활동을 할 수 있는 수업 참여 도구. 학생은 가입 없이 코드로 참여해요.
  use: 학생 활동 가능

- id: teachable-machine
  name: 티처블 머신
  url: https://teachablemachine.withgoogle.com
  category: AI 원리 체험
  description: 사진·소리·자세를 학습시켜 나만의 AI 모델을 만들어 보는 체험 도구. 'AI는 어떻게 배울까?' 수업에 좋아요.
  use: 학생 활동 가능

- id: quickdraw
  name: Quick, Draw!
  url: https://quickdraw.withgoogle.com
  category: AI 원리 체험
  description: 그림을 그리면 AI가 무엇인지 맞히는 게임. AI가 데이터로 학습한다는 것을 놀이로 체험해요.
  use: 학생 활동 가능

- id: autodraw
  name: AutoDraw
  url: https://www.autodraw.com
  category: AI 원리 체험
  description: 대충 그린 그림을 AI가 알아보고 깔끔한 그림으로 바꿔 줘요. 저학년 AI 첫 경험으로 추천해요.
  use: 학생 활동 가능

- id: entry
  name: 엔트리
  url: https://playentry.org
  category: 코딩·SW
  description: 블록 코딩 교육 플랫폼. 인공지능 블록으로 번역, 음성 인식, 모델 학습 활동을 할 수 있어요.
  use: 학생 활동 가능

- id: claude-code
  name: 클로드 코드 (Claude Code)
  url: https://claude.com/product/claude-code
  category: AI 에이전트
  description: 내 컴퓨터의 폴더에서 파일을 읽고 만들고 정리하는 AI 에이전트. 엑셀 집계, 설문 분석, 파일 정리, 간단한 프로그램 만들기를 우리말로 시킬 수 있어요.
  use: 교사용
  note: Claude 유료 요금제(Pro 이상)가 필요해요. 실제 업무 파일은 복사본으로 작업하세요.

- id: claude-in-chrome
  name: Claude in Chrome
  url: https://claude.com/chrome
  category: AI 브라우저
  description: 크롬에 설치하는 확장 프로그램. 클로드가 웹페이지를 읽고 클릭·입력·양식 작성을 대신해요. 사이트마다 허락을 받으며 일해요.
  use: 교사용
  note: Claude 유료 요금제가 필요해요. 나이스·업무포털 등 학교 행정 시스템에는 쓰지 마세요.

- id: comet
  name: Comet
  url: https://www.perplexity.ai/comet
  category: AI 브라우저
  description: 퍼플렉시티가 만든 AI 브라우저. 열린 탭 요약, 자료 조사, 웹에서의 반복 작업을 맡길 수 있어요. 무료로 쓸 수 있어요(사용량 제한 있음).
  use: 교사용
  note: 새 브라우저로 설치해요. 중요한 계정은 로그인한 채로 AI에게 맡기지 마세요.

- id: gb-aischool
  name: 경북AI배움터
  url: https://aischool.gbe.kr
  category: 교육청 플랫폼
  description: 경상북도교육청이 운영하는 교사·학생 통합 학습 플랫폼. 에듀테크 서비스, 나의 강의실(구글·웨일 클래스), 학급 관리, 수업·학습 자료실, 학습 분석 대시보드를 한 계정으로 써요.
  use: 학생 활동 가능
  note: 학생이 쓰는 서비스는 학교 개인정보 동의 절차(공지사항의 동의 양식)를 먼저 확인하세요.

- id: works-ai
  name: 경북형 웍스AI
  url: https://gov.wrks.ai
  category: 교육청 플랫폼
  description: 교육청 계정으로 쓰는 업무용 AI. 가정통신문·민원 답변·공문 요약·평어 초안·학교자율시간 설계 같은 교육용 에이전트와 경상북도교육청 자체 에이전트를 제공해요.
  use: 교사용
  note: 개인정보 등 민감정보는 입력·업로드하지 마세요. 결과는 초안으로만 쓰세요.

- id: higgsfield
  name: 힉스필드 (Higgsfield)
  url: https://higgsfield.ai
  category: AI 영상·이미지
  description: 여러 AI 모델로 이미지·영상·나레이션을 만드는 서비스. MCP 커넥터로 Claude와 연결하면 대화로 영상을 만들 수 있어요.
  use: 교사용
  note: 유료 크레딧이 들어요. 학생 사진·실존 인물 얼굴은 쓰지 말고, 학생 사용 전 이용약관 연령 기준을 확인하세요.

- id: tpicks
  name: 티픽스 (TPICKS)
  url: https://tpicks.kr
  category: 교사 커뮤니티·자료
  description: 교실 웹도구, 교사가 만든 설치형 프로그램, 교사 커뮤니티, 계기교육 모음, PICK BOT과 학부모 답장 AI를 한곳에 모은 교사용 플랫폼.
  use: 교사용
  note: PICK BOT·학부모 답장 AI에 학생·학부모 개인정보를 넣지 마세요.

- id: apps-script
  name: 구글 Apps Script
  url: https://script.google.com
  category: 코딩·SW
  description: 구글 시트·문서·드라이브를 자동으로 다루는 구글의 무료 코딩 도구. 화면을 붙여 '웹 앱'으로 배포하면 우리 반 전용 앱을 만들 수 있어요.
  use: 교사용
  note: 학교 구글 계정으로 만들고, 시트 공유는 '나만', 접근은 우리 학교 도메인으로 제한하세요.

- id: ai-tamheom
  name: AI 탐험 기지
  url: https://ai-tamheom-giji.web.app
  category: AI 원리 체험
  description: 학생은 닉네임으로 들어와 미션(AI 찾기·AI 가르치기·AI 실수 찾기·AI 약속)을 풀며 도장·배지를 모으고, 교사는 진도·공지·결과를 한 화면에서 관리하는 실시간 수업 웹앱.
  use: 학생 활동 가능
  note: 연습할 때는 주소 끝에 &local 을 붙이면 실제 수업 기록과 섞이지 않아요. 수업 뒤에는 교사 화면에서 기록을 지워 주세요.

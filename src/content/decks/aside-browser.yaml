# 「AI 브라우저 Aside로 웹 업무 맡기기」 발표 슬라이드
# 표지 · 강사 소개(PDF만) · 감사합니다 장은 자동으로 붙어요.
# 캡처를 더 받으면 list 장에 image / marks 를 넣어요 (교안의 '📸 캡처 예정' 주석 참고).
lesson: aside-browser
badge: AI 브라우저 · 초등 교원 연수
title: "AI 브라우저 Aside로\n웹 업무 맡기기"
parts:
  - "1부  이해하고, 설치하고, 안전하게"
  - "2부  가벼운 기능부터 작업 맡기기까지"
  - "3부  루틴 · 메모리 · 안전 약속"
cover: /images/covers/aside-browser.jpg
thanks: "실습 문장 · 활동지 · 가상 가정통신문은 온라인 교안에서 언제든 다시 받을 수 있어요."

slides:
  - type: guide
    title: 연수 안내
    have:
      - "📘  오늘 교안 (웹 · PDF)"
      - "💬  실습 문장 9개 [복사]"
      - "📝  실습 활동지"
      - "📄  가상 가정통신문 PDF 2개"
    need:
      - { title: 노트북, text: "macOS 15+ 또는 Windows 10 22H2+" }
      - { title: 이메일 주소, text: "Aside 계정 만들기" }
      - { title: "(있으면) Claude · ChatGPT 구독", text: "없으면 무료 크레딧으로" }
      - { title: PDF 2개 → 다운로드 폴더, text: "교안의 ‘자료 내려받기’에서" }

  - type: flow
    title: 오늘의 흐름 (2시간)
    columns:
      - label: 1부 · 40분
        title: 이해하고 설치하기
        items: [챗봇과 다른 점, 일 시키는 네 가지 방법, "실습① 설치 · AI 연결", 안전 설정 먼저]
      - label: 2부 · 45분
        title: 기능과 작업
        items: ["실습② 요약 · 사이드 패널", 일 잘 시키는 문장, "실습③ 여러 사이트 조사", "실습④ PDF → 엑셀"]
      - label: 3부 · 25분
        title: "루틴 · 메모리 · 안전"
        items: ["실습⑤ 월요일 아침 루틴", 메모리 보고 고치기, 안전하게 쓰는 일곱 가지, "심화: 클로드 코드 연결"]
    note:
      title: 설치는 지금 다 같이
      text: "aside.com/download · 쉬는 시간은 2부 중간에 10분"

  - type: break
    title: "매주 웹에서 똑같이 하는\n클릭, 무엇이 있나요?"
    text: 오늘 끝날 때 그 일 하나를 Aside에게 맡겨 봐요

  - type: section
    part: 1부
    title: "이해하고,\n설치하고, 안전하게"
    lead: 답을 주는 AI에서 일을 끝내는 AI로
    items: [챗봇과 AI 브라우저, 일 시키는 네 가지 방법, "실습① 설치 · AI 연결", 안전 설정 세 가지]
    image: /images/aside-browser/slides/panel.jpg

  - type: compare
    tag: 차이
    title: 챗봇 vs AI 브라우저
    columns:
      - title: 챗봇 (대화창)
        items: ["돌려주는 것: **답** (글)", "일하는 곳: 대화창 안", "잘하는 일: 설명 · 초안", "조심: 사실 확인"]
      - title: AI 브라우저 (Aside)
        items: ["돌려주는 것: **끝낸 일**", "일하는 곳: 로그인한 사이트 · 내 파일", "잘하는 일: 모으기 · 클릭 · 정리", "조심: 사실 + **AI가 한 행동**"]
    note:
      title: 크롬과 같은 바탕(크로미움)이라 쓰는 법은 비슷해요
      text: 옆의 AI에게 시키면 직접 열고 · 클릭하고 · 입력해요

  - type: steps
    tag: 네 가지 방법
    title: Aside에게 일 시키는 네 가지 방법
    steps:
      - { title: 글자 고르기, text: "드래그 →\n요약 · 번역" }
      - { title: 사이드 패널, text: "Ctrl + S\n지금 보는 페이지로" }
      - { title: 작업 (Task), text: "Ctrl + Shift + E\n여러 사이트 · 파일" }
      - { title: 루틴, text: "정해진 때\n저절로" }
    note:
      title: 작은 일 → 큰 일 · 반복하는 일
      text: 처음에는 왼쪽부터, 익숙해지면 오른쪽으로

  - type: table
    tag: 요금
    title: 무료로도 충분히 시작해요
    head: [요금제, 들어 있는 것]
    rows:
      - ["**Free** · 0원", "월 500크레딧 · 루틴 3개 · 비밀번호 금고 · 메모리"]
      - [Pro · 월 20달러, "무료의 3배 · **Ultrabrowse**(깊은 조사) · 루틴 무제한"]
      - [Max · 월 200달러, "무료의 40배"]
      - [구독 연결, "Claude Pro/Max · ChatGPT(Plus 이상) → 그 구독 사용량으로"]
    note:
      title: "크레딧은 📍 Settings › Plan & Usage 에서"
      text: 큰 모델 · 긴 대화일수록 많이 써요 · 무료 크레딧은 매달 1일에 다시 채워져요

  - type: quiz
    tag: 퀴즈
    title: Aside, 우리 반 학생 수업에 써도 될까요?
    options:
      - { label: A, title: "써도 돼요\n학생 계정 만들기", text: "무료 요금제로" }
      - { label: B, title: "안 돼요\n선생님 업무용", text: "가입 연령 기준" }
    answer:
      title: "B — 13세 이상만 가입할 수 있어요"
      text: 초등학생은 쓸 수 없어요 · 오늘은 선생님 업무를 줄이는 도구로

  - type: steps
    tag: 실습 ①
    title: 다 같이 설치하기
    steps:
      - { title: 내려받기, text: "aside.com/download\n내 컴퓨터에 맞게" }
      - { title: 계정 만들기, text: "이메일로\n가입 · 로그인" }
      - { title: 데이터 가져오기, text: "공용 노트북이면\n하지 않기" }
      - { title: 비밀번호 금고, text: "설정하고\n첫 작업 화면까지" }
    note:
      title: 쿠키를 가져오면 로그인 상태도 넘어와요
      text: AI가 그 계정으로 들어갈 수 있다는 뜻 · 업무 계정 프로필은 한 번 더 생각하기

  - type: list
    tag: 실습 ①
    title: "AI 연결: Settings › Models"
    image: /images/aside-browser/models-slide.jpg
    marks: [{ n: 1, x: 26.2, y: 42.0 }, { n: 2, x: 66.2, y: 79.5 }, { n: 3, x: 14.7, y: 93.9 }]
    items:
      - { title: "Providers › Connect", text: "Subscription → Claude 또는 ChatGPT" }
      - { title: Default model, text: "새 작업의 기본 모델" }
      - { title: "Task models (Fast …)", text: "일 종류별 모델 · 처음엔 그대로" }
    note:
      title: 구독이 없으면 맨 위 ‘Aside (Free)’ 로
      text: 연결한 구독 모델을 쓰면 Aside 크레딧이 아니라 그 구독 사용량을 써요

  - type: table
    tag: 모델
    title: 일 종류마다 다른 모델
    head: [칸, 하는 일]
    rows:
      - [Default, "새 작업의 기본 (마지막에 쓴 모델이 기본이 돼요)"]
      - [Fast, "곁일 · 요약 · 메모리 정리 (예: Haiku)"]
      - [Standard, "하위 작업 · 메모리 다시 정리 (예: Sonnet)"]
      - [Deep, "어려운 판단 · 계획 · 종합 (예: Opus)"]
      - [Visual, "그림 · 화면 · CAPTCHA 읽기"]
    note:
      title: 처음에는 바꾸지 않아도 돼요
      text: 간단한 일은 가벼운 모델이 빠르고 아껴 써요

  - type: list
    tag: 실습 ①
    title: 안전 설정 먼저 (3분)
    image: /images/aside-browser/slides/safety.jpg
    items:
      - { title: "작업 권한: Guard", text: "Settings › Agents · 정한 폴더만, 나머지는 물어봄" }
      - { title: "비밀번호: While unlocked", text: "Settings › Passwords › Access policy (또는 Never)" }
      - { title: "메모리: 30 days", text: "Settings › Memory › Configure" }
    note:
      title: 비밀번호 금고는 AI에게 비밀번호를 보여 주지 않아요
      text: 웹사이트 칸에만 채워 줘요 · 그래도 은행 · 나이스 비밀번호는 넣지 않기

  - type: section
    part: 2부
    title: "가벼운 기능부터\n작업 맡기기까지"
    lead: 한 문단 → 한 페이지 → 여러 사이트 · 파일
    items: ["실습② 요약 · 사이드 패널 · 탭 나란히", 일 잘 시키는 문장, "실습③ 체험학습 장소 비교", "실습④ 가정통신문 → 엑셀"]
    image: /images/aside-browser/slides/research.jpg

  - type: list
    tag: 실습 ②
    title: 글자 고르기 · 사이드 패널 · 탭 나란히
    items:
      - { title: 글자 드래그, text: "Summarize · Translate · Settings › Lasso 로 나만의 메뉴" }
      - { title: 사이드 패널 (Ctrl + S), text: "지금 페이지가 붙어 있는지 확인하고 시키기" }
      - { title: "탭 나란히 (Ctrl + Shift + \\)", text: "자료와 양식을 같이 보기" }
      - { title: Ask Aside (Ctrl + E), text: "지금 바로 묻기" }
    note:
      title: "나만의 메뉴 예: “4학년 눈높이로 3문장: {text}”"
      text: 고른 글자가 {text} 자리에 들어가요

  - type: prompt
    tag: 실습 ②
    title: 사이드 패널로 공지를 표로
    label: 공지 → 연수 일정 표
    text: |
      이 페이지의 공지 중 교원 연수와 관련된 것만 골라서
      제목 · 게시일 · 신청 마감일을 표로 정리해 줘. 마감일이 없으면 '없음'이라고 써 줘.

  - type: break
    title: 쉬는 시간 (10분)
    text: 돌아오면 여러 사이트를 오가는 ‘작업’을 맡겨 봐요

  - type: steps
    tag: 작업 문장
    title: 일 잘 시키는 문장 = 네 조각
    steps:
      - { title: 어디서, text: "국립경주박물관\n누리집에서" }
      - { title: 무엇을, text: "단체 관람 시간과\n휴관일을 찾아" }
      - { title: 어떤 모양, text: "표로 정리하고\n출처 주소도" }
      - { title: 멈출 곳, text: "예약 신청은\n하지 마" }
    note:
      title: "“일 좀 처리해 줘” 는 엉뚱한 곳으로 가요"
      text: 돈 · 개인정보 · 보내기 · 신청이 걸린 일은 멈출 곳을 꼭

  - type: table
    tag: 작업 창
    title: 작업 창에서 고르는 네 가지
    head: [칸, 고를 것]
    rows:
      - [모드, "**Default** (평소 브라우저) · Incognito (로그인 · 기록 없이)"]
      - [권한, "Read only (보기만) · **Guard** (기본) · Full access (컴퓨터 전체 — 쓰지 않기)"]
      - [작업 폴더, "파일을 다룰 폴더 하나만"]
      - [모델, "일의 크기에 맞게 · Pro는 Ultrabrowse(출처 많은 깊은 조사)"]
    note:
      title: 시크릿(Incognito) 모드에서는 비밀번호 금고를 못 써요
      text: 로그인이 필요 없는 조사는 시크릿 모드가 깔끔해요

  - type: prompt
    tag: 실습 ③
    title: 체험학습 장소 비교표
    label: 여러 사이트 조사
    text: |
      초등학교 4학년 현장체험학습 장소를 비교하려고 해.
      국립경주박물관, 국립대구박물관, 국립중앙과학관 누리집에서
      단체 관람 운영 시간, 관람료(초등학생 단체), 예약 방법, 휴관일을 찾아서 표로 정리해 줘.
      각 정보를 찾은 페이지 주소도 함께 적어 줘. 예약 신청은 하지 말고 정보만 모아 줘.

  - type: list
    tag: 실습 ③
    title: 일하는 과정이 다 보여요
    image: /images/aside-browser/task-running.jpg
    marks: [{ n: 1, x: 36.0, y: 14.1 }, { n: 2, x: 19.0, y: 42.0 }, { n: 3, x: 4.7, y: 60.8 }]
    items:
      - { title: 보낸 요청, text: "오른쪽 말풍선" }
      - { title: Working for 30s, text: "누르면 과정을 펼쳐 봐요" }
      - { title: 찾아본 페이지, text: "어떤 말로 검색하고 무엇을 열었는지" }
    note:
      title: 결과 표의 출처 주소는 한두 개 직접 눌러 확인
      text: 날짜 · 금액 · 전화번호는 원래 누리집에서 다시 확인하고 예약은 직접

  - type: list
    tag: 실습 ③
    title: 일하는 도중에 바로잡기
    image: /images/aside-browser/steer.jpg
    marks: [{ n: 1, x: 65.3, y: 59.7 }, { n: 2, x: 12.2, y: 72.7 }]
    items:
      - { title: 도중에 한 줄 보내기, text: "“관람료는 무료인지 유료인지만 짧게”" }
      - { title: Steer, text: "지금 하는 일에 바로 반영" }
      - { title: Queue, text: "하던 일을 마친 뒤 반영" }
    note:
      title: "📍 Settings › Agents › Chat 에서 고르기"
      text: "방향을 당장 바꿔야 하면 Steer — “그 페이지 말고 이 페이지를 써”"

  - type: list
    tag: 실습 ④
    title: 가정통신문 PDF → 일정 엑셀
    image: /images/aside-browser/slides/files.jpg
    items:
      - { title: PDF 2개를 다운로드 폴더에, text: "실습용 가상 가정통신문" }
      - { title: 작업 폴더 = 다운로드, text: "권한은 Guard 그대로" }
      - { title: 문장 보내기, text: "다음 장의 [복사]" }
      - { title: 만든 파일 확인, text: "작업 화면에서 열어 PDF와 비교" }
    note:
      title: 진짜 문서는 학생 이름 · 연락처가 없는 것만
      text: 회신서처럼 개인정보가 적힌 파일은 맡기지 않아요

  - type: prompt
    tag: 실습 ④
    title: 내 컴퓨터 파일로 일하기
    label: 가정통신문 → 일정 엑셀
    text: |
      다운로드 폴더에 있는 가정통신문 PDF 두 개를 읽고
      행사 이름 · 날짜 · 장소 · 준비물 · 비용 · 회신 마감일을 한 줄씩 정리한 엑셀 파일을
      다운로드 폴더에 '학부모_일정_정리.xlsx'로 저장해 줘. 다른 폴더는 건드리지 마.

  - type: section
    part: 3부
    title: "루틴 · 메모리 ·\n안전 약속"
    lead: 반복은 맡기고, 기억은 확인하고, 선은 지키고
    items: ["실습⑤ 월요일 아침 루틴", 메모리 보고 고치기, 안전하게 쓰는 일곱 가지, "심화: 클로드 코드와 연결"]
    image: /images/aside-browser/slides/routine.jpg

  - type: steps
    tag: 실습 ⑤
    title: "Create routine — 월요일 아침 공지 요약"
    steps:
      - { title: Title, text: "월요일\n공지 요약" }
      - { title: Prompt, text: "다음 장의\n지시문 [복사]" }
      - { title: "Repeat · On · Time", text: "Weekly · Monday\n8:00 AM" }
      - { title: "Model · Create", text: "가벼운 모델 · 알림 켜기\n→ Run now 로 확인" }
    note:
      title: "📍 Settings › Routines"
      text: 목록의 ‘Find routine suggestions’ 로 내가 자주 하는 일을 루틴으로 추천받기

  - type: prompt
    tag: 실습 ⑤
    title: 루틴 지시문
    label: 월요일 아침 공지 요약
    text: |
      경상북도교육청 누리집 공지사항에서 지난 7일 동안 올라온 글 가운데
      초등 교원 연수 · 공모 · 행사 안내만 골라
      제목, 마감일, 링크를 5줄 이내로 요약해 줘.

  - type: list
    tag: 루틴
    title: 루틴, 이것만 알아 두기
    items:

# 「모션 그래픽 만드는 법」 발표 슬라이드 (90분)
# 표지 · 강사 소개(PDF만) · 감사합니다 장은 자동으로 붙어요.
lesson: motion-graphics
badge: 수업 영상 · 초등 교원 연수
title: "모션 그래픽 만드는 법,\n밋밋한 영상 살리기"
parts:
  - "1부  모션 그래픽 · 두 영상 비교"
  - "2부  좋아지게 만드는 7가지"
  - "3부  우리 반 영상 만들기"
cover: /images/covers/motion-graphics.jpg
thanks: "예시 영상 · 원본 묶음 · 요청문은 온라인 교안에서 언제든 다시 볼 수 있어요."

slides:
  - type: guide
    title: 연수 안내
    have:
      - "🎬  예시 영상 v1 · v2 (.mp4)"
      - "📦  영상 원본 묶음 (.zip)"
      - "💬  요청문 9개 [복사]"
      - "📝  설계 · 고치기 활동지"
    need:
      - { title: "노트북", text: "클로드 데스크톱 앱 · 유료 요금제" }
      - { title: "HyperFrames", text: "미리 설치 (설치 교안 참고)" }
      - { title: "우리 반 숫자 3개", text: "함께한 날 · 읽은 책 · 칭찬 스티커처럼" }
      - { title: "약속 하나", text: "학생 이름 · 얼굴은 넣지 않기" }

  - type: flow
    title: 오늘의 흐름 (90분)
    columns:
      - label: 1부 · 25분
        title: 모션 그래픽 · 비교
        items: ["모션 그래픽이란", "v1 · v2 비교", "실습① 처음 버전"]
      - label: 2부 · 35분
        title: 좋아지게 만드는 7가지
        items: ["숫자 하나씩 · 사물로", "속도 곡선 · 차례와 멈춤", "이유 있는 전환 · 소리", "실습② 고치기"]
      - label: 3부 · 30분
        title: 우리 반 영상
        items: ["실습③ 우리 반 숫자로", "스스로 고칠 점 찾기", "안전하게 · 나누기"]
    note:
      title: "오늘의 한 문장"
      text: "한 번에 하나, 이유 있게 움직이기"

  - type: section
    part: 1부
    title: "모션 그래픽 ·\n두 영상 비교"
    lead: 글자 · 도형 · 숫자가 움직이며 이야기하는 영상
    items: ["학급 경영", "수업 도입", "통계 · 그래프", "행사 오프닝"]
    image: /images/covers/motion-graphics.jpg

  - type: list
    tag: 비교
    title: 같은 숫자, 두 영상
    image: /images/motion-graphics/slides/objects.jpg
    caption: 왼쪽 위 v1 · 나머지 셋은 v2의 장면들
    items:
      - { title: "v1 · 15초", text: "카드 세 개 · 숫자가 한꺼번에 · 소리 없음" }
      - { title: "v2 · 21초", text: "장면마다 숫자 하나 · 사물로 · 효과음" }
      - { title: "v1이 틀린 건 아니에요", text: "숫자도 맞고 잘 보여요" }
      - { title: "그런데 기억에 안 남아요", text: "왜 그럴까요?" }

  - type: compare
    tag: 비교
    title: 시간표로 펼쳐 보면
    columns:
      - title: v1 (15초)
        items: ["제목 4초", "카드 3개 · 숫자 **동시에** 7초", "**4초 동안 아무것도 안 바뀜**", "끝 인사 · 소리 없음"]
      - title: v2 (21초)
        items: ["제목 3.4초 (0초부터 보임)", "190일 · 달력 → 1,248권 · 막대", "→ 3,650개 · 스티커 병", "숫자가 멈출 때마다 **“톡”** 3번"]
    note:
      title: "장면마다 바탕색도 달라요"
      text: "초록 · 크림 · 하늘 — 색만 봐도 지금 무슨 숫자인지 알아요"

  - type: prompt
    tag: 실습 ①
    title: 처음 버전(v1) 만들기 — 일부러 짧게
    label: 처음 버전 만들기
    text: |
      HyperFrames로 15초짜리 가로 영상(1920×1080)을 만들어 줘.
      제목: 숫자로 보는 우리 반 1년 (4학년 2반의 2026년)
      숫자 세 개를 카드로 보여 줘: 함께한 날 190, 읽은 책 1,248, 칭찬 스티커 3,650
      마지막에 "고마워, 4학년 2반!"
      화면 구석에 작게 '예시 숫자'라고 써 줘.

  - type: section
    part: 2부
    title: "좋아지게 만드는\n7가지"
    lead: 미리보기를 보며 체크리스트로 점검해요
    items: ["숫자 하나씩", "숫자를 사물로", "속도 곡선", "차례와 멈춤", "이유 있는 전환", "소리", "블록 · 안전 영역 · 점검"]
    image: /images/motion-graphics/slides/makeover.jpg

  - type: list
    tag: ① · ②
    title: 숫자는 하나씩, 그리고 사물로
    image: /images/motion-graphics/slides/watch.jpg
    items:
      - { title: "장면 하나에 숫자 하나", text: "눈은 한 번에 한 곳만 봐요" }
      - { title: "바퀴처럼 굴러가다 “착”", text: "도착했다는 느낌" }
      - { title: "190일 → 달력 칸 190개", text: "1,248권 → 월별 책 막대" }
      - { title: "3,650개 → 스티커 병", text: "숫자의 크기가 눈에 보여요" }

  - type: list
    tag: ③
    title: 움직임에도 성격이 있어요 — 이징
    image: /images/motion-graphics/slides/ease.jpg
    items:
      - { title: "일정한 속도 (linear)", text: "로봇처럼 딱딱해요" }
      - { title: "들어올 때 · expo.out", text: "빠르게 와서 천천히 멈춤 — “착!”" }
      - { title: "나갈 때 · power3.in", text: "등장보다 짧게, 휙" }
      - { title: "모두 같은 움직임 X", text: "요소마다 어울리는 움직임" }

  - type: list
    tag: ④
    title: 차례대로, 그리고 멈춤
    image: /images/motion-graphics/slides/stagger.jpg
    items:
      - { title: "읽는 순서대로 시간 차", text: "축 → 막대(0.07초씩) → 숫자 → 주석" }
      - { title: "제목도 낱말 하나씩", text: "흐릿함이 걷히며" }
      - { title: "3초 넘게 그대로 X", text: "v1의 6.75~10.9초" }
      - { title: "읽을 시간은 꼭", text: "0.5초 + 낱말마다 0.3초" }

  - type: list
    tag: ⑤
    title: 이유 있는 전환 — 물건이 다음 장면을 불러와요
    image: /images/motion-graphics/slides/transition.jpg
    items:
      - { title: "제목 → 190일", text: "작은 달력 카드가 커져서 화면이 돼요" }
      - { title: "190일 → 1,248권", text: "같은 방향으로 빠지고 들어와요" }
      - { title: "1,248권 → 3,650개", text: "주황 막대가 위로 솟아요" }
      - { title: "→ 고마워", text: "초록색이 아래에서 차올라요" }

  - type: list
    tag: ⑥ · ⑦
    title: 소리, 블록, 안전 영역
    image: /images/motion-graphics/slides/sound.jpg
    items:
      - { title: "숫자가 멈출 때 “톡”", text: "보이는 움직임과 같은 순간에" }
      - { title: "음악은 저작권 확인", text: "이번 예시는 효과음만 (음악 만들기는 HeyGen 로그인 필요)" }
      - { title: "레지스트리 블록 쓰기", text: "숫자 바퀴 · 약 450개 효과" }
      - { title: "글자는 화면 안쪽 80%", text: "0초 화면도 비우지 않기 (섬네일)" }

  - type: prompt
    tag: 실습 ②
    title: v1을 v2처럼 한 번에 고치기
    label: 한 번에 고치기
    text: |
      지금 영상을 아래 7가지 방법으로 고쳐 줘. 고치기 전에 장면별 계획을 표로 먼저 보여 줘.
      1. 장면 하나에 숫자 하나 (숫자는 바퀴처럼 굴러가다 멈추게)
      2. 숫자를 사물로: 190일은 달력 칸, 1,248권은 월별 책 막대, 3,650개는 스티커 병
      3. 등장은 빠르게 와서 천천히 멈추고, 퇴장은 더 짧게
      4. 여러 개는 차례대로, 다 나온 뒤 읽을 시간 주기
      5. 앞 장면의 물건이 다음 장면으로 이어지는 전환
      6. 숫자가 멈출 때 짧은 효과음
      7. 중요한 글자는 화면 안쪽 80% 안에, 0초 화면에도 제목이 보이게

  - type: table
    tag: 실습 ②
    title: 말로 고치기 팁
    head: ["이렇게 말하면 어려워요", "이렇게 말해요"]
    rows:
      - ["더 멋있게 해 줘", "두 번째 장면 숫자를 1초 늦게 나오게 해 줘"]
      - ["막대가 이상해", "8초쯤 막대를 0.1초 간격으로 천천히 자라게 해 줘"]
      - ["다 고쳐 줘", "한 번에 한두 가지만 → 다시 보기"]
      - ["알아서 해 줘", "고칠 점 5가지를 표로 먼저 보여 줘"]

  - type: section
    part: 3부
    title: "우리 반\n영상 만들기"
    lead: 원본 묶음에 우리 반 숫자만 넣으면 돼요
    items: ["실습③ 우리 반 숫자로", "스스로 고칠 점 찾기", "안전하게 쓰기"]
    image: /images/motion-graphics/slides/storyboard.jpg

  - type: prompt
    tag: 실습 ③
    title: 우리 반 숫자로 바꾸고 MP4 만들기
    label: 우리 반 숫자로 바꾸기
    text: |
      2_고친뒤_v2 폴더의 영상을 우리 반 숫자로 바꿔 줘.
      반 이름: ○학년 ○반
      함께한 날: ○일 / 읽은 책: ○권 (월별 권수: 3월 ○, 4월 ○ …) / 칭찬 스티커: ○개
      가장 많이 읽은 달의 주석은 "○○○"로 해 줘.
      다 바꾸면 미리보기를 열어 주고, 내가 괜찮다고 하면 MP4로 만들어 줘.

  - type: steps
    tag: 스스로 점검
    title: 고칠 점은 이렇게 찾았어요
    steps:
      - { title: "점검 도구 (check)", text: "멈춘 곳 · 못 읽는 글자\n빈 첫 화면 · 색 차이" }
      - { title: "정지 화면 (snapshot)", text: "장면 시작 · 중간\n전환 앞뒤" }
      - { title: "클로드에게 묻기", text: "고칠 점 5가지를\n표로 먼저" }
      - { title: "골라서 고치기", text: "한두 가지씩\n다시 보기" }
    note:
      title: "“모션 디자이너의 눈으로 봐 줘”"
      text: "지금 어떤지 → 어떻게 바꾸면 좋은지 → 왜 좋은지"

  - type: list
    tag: 안전하게
    title: 안전하고 바르게 쓰기
    items:
      - { title: "학생 개인 정보 X", text: "이름 · 얼굴 · 성적 대신 학급 전체 숫자" }
      - { title: "숫자는 사실대로", text: "평균 같은 계산은 직접 다시 확인" }
      - { title: "글꼴 · 음악 저작권", text: "프리텐다드 · 주아는 무료 (SIL OFL)" }
      - { title: "학급 밖에 올릴 때", text: "학교 방침 · 학부모 동의 먼저" }

  - type: quiz
    tag: 퀴즈
    title: "숫자 카드 세 개가 동시에 올라가는 영상, 무엇부터 고칠까요?"
    options:
      - { label: A, title: "글자를 더 크게", text: "잘 보이게" }
      - { label: B, title: "장면 하나에\n숫자 하나씩", text: "한 번에 하나" }
    answer:
      title: "B — 눈은 한 번에 한 곳만 봐요"
      text: "숫자가 멈추면 설명 → 읽을 시간 → 다음 숫자 · 숫자를 사물로 보여 주면 더 좋아요"

  - type: break
    title: "우리 반 1년을\n숫자 세 개로 말한다면?"
    text: "어떤 숫자를 고를까요? · 그 숫자는 어떤 물건으로 보여 줄 수 있을까요?"

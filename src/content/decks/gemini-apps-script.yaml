      - ["‘시트가 준비되지 않았어요’", setup을 먼저 한 번 실행했는지 확인]
      - [고쳤는데 학생 화면이 그대로, "배포 관리 → ✏️ → ‘새 버전’으로 배포"]
      - ["‘확인하지 않은 앱’ 경고", "[고급] → ‘(으)로 이동(안전하지 않음)’ → [허용]"]
      - [학교 계정에서 막힘, 관리자 설정 문제 — 개인 계정으로 만들기]

  - type: prompt
    tag: 오류 고치기
    title: 오류는 제미나이에게 그대로 보여 주기
    label: 오류 고치기 요청
    text: |
      구글 Apps Script 웹앱에서 오류가 났어. 나는 코딩을 잘 몰라.
      원인을 쉬운 말로 설명하고, 고치는 방법을 순서대로 알려 줘.
      코드를 고쳐야 하면 고친 파일의 전체 코드를 다시 보여 줘.

      [어디서] 예) setup 실행할 때 / 웹앱 주소를 열 때 / 제출 버튼을 눌렀을 때
      [오류 메시지] (화면이나 실행 로그의 빨간 글씨를 그대로 붙여 넣기)
      [내 코드] (Code.gs와 Index.html 붙여 넣기)
    note: { title: "화면 캡처를 붙여 넣어도 돼요 · 학생 정보가 보이면 가리고" }

  - type: prompt
    tag: 기능 더하기
    title: 한 번에 하나씩 더하기
    label: 기능 추가 요청
    text: |
      지금 만든 퀴즈 앱에 기능을 하나 더하고 싶어.
      - 문제마다 20초 타이머를 보여 주고, 시간이 지나면 자동으로 다음 문제로 넘어가게 해 줘.
      - 시간 안에 답을 못 고른 문제는 오답으로 채점해 줘.
      바뀐 부분만이 아니라 Code.gs와 Index.html 전체를 다시 보여 주고,
      다시 배포할 때 ‘새 버전’으로 하는 방법도 알려 줘.

      (지금 코드 붙여 넣기)

  - type: list
    tag: 새 버전
    title: 고친 코드는 ‘새 버전’으로 배포
    image: /images/gemini-apps-script/new-version.svg
    mock: true
    marks: [{ n: 1, x: 87.5, y: 24.7 }, { n: 2, x: 72.7, y: 39.3 }, { n: 3, x: 89.0, y: 85.0 }]
    items:
      - { title: "[배포 → 배포 관리] → ✏️", text: 연필 모양 수정 버튼 }
      - { title: "버전: ‘새 버전’", text: 설명에 무엇을 고쳤는지 }
      - { title: "[배포]", text: 웹 앱 주소는 그대로예요 }

  - type: prompt
    tag: 나만의 Gem
    title: 매번 같은 말 대신 ‘Gem’에 저장
    label: "Gem 지침 (제미나이 → Gem → 새 Gem 만들기)"
    text: |
      너는 코딩을 모르는 초등학교 선생님을 돕는 구글 Apps Script 도우미야.
      - 코드를 쓰기 전에 화면 구성과 시트 구성을 표로 먼저 보여 주고 확인을 받아.
      - 파일은 Code.gs와 Index.html 두 개로, 고친 파일은 항상 전체 코드를 보여 줘.
      - 처음 한 번 실행하는 setup 함수로 시트 탭을 자동으로 만들어 줘.
      - 학생 개인정보는 최소로(이름 대신 번호), 정답과 점수 계산은 서버(Code.gs)에서 해.
      - 설명은 쉬운 한국어로, 붙여 넣기와 배포 순서는 번호를 붙여 알려 줘.
    note: { title: "Gem 이름 예: 우리 반 앱 도우미 · 메뉴 이름은 조금 다를 수 있어요" }

  - type: compare
    tag: 보너스
    title: 이런 길도 있어요
    columns:
      - title: 편집기 속 제미나이 (베타)
        items: [Apps Script 편집기 안의 제미나이 패널, 코드를 보면서 바로 고쳐 달라기, "Google AI Pro 이상 · 계정 언어를 영어로 해야 보일 수 있어요"]
      - title: 캔버스로 화면 미리보기
        items: ["제미나이 ‘캔버스’에서 화면만 먼저 보기", 색과 버튼 모양을 마음껏 바꿔 보기, 시트 저장은 Apps Script에 붙여야 동작]

  - type: prompts
    tag: 아이디어
    title: 이런 앱도 같은 방법으로
    items:
      - title: 칭찬 도장판
        text: 학생이 번호를 고르면 내 칭찬 도장이 보이고, 교사는 시트에서 도장을 줘요
        copy: "앞에서처럼 설계부터 같이 하자. [만들 앱] 우리 반 칭찬 도장판 — 학생은 번호를 고르면 내 칭찬 도장 개수와 도장판을 보고, 교사는 시트의 '도장' 탭에 번호와 날짜, 칭찬 내용을 적어 도장을 줘. 학생 이름은 받지 않고 번호만. 먼저 화면 구성, 시트 탭과 열 구성, 동작 순서를 표로 정리해 줘. 코드는 아직 쓰지 마."
      - title: 1인 1역 체크
        text: 오늘 내 역할을 했으면 체크, 날짜별로 시트에 기록돼요
        copy: "앞에서처럼 설계부터 같이 하자. [만들 앱] 우리 반 1인 1역 체크 — 학생은 번호를 고르면 내 역할이 보이고, 오늘 했으면 [했어요]를 눌러. 시트에는 날짜·번호·역할이 기록되고, 교사는 이번 주 표를 시트에서 봐. 역할 목록은 시트의 '역할' 탭에서 교사가 정해. 먼저 화면 구성, 시트 탭과 열 구성, 동작 순서를 표로 정리해 줘. 코드는 아직 쓰지 마."
      - title: 우리 반 독서 나무
        text: 책 제목과 한 줄 느낌을 남기면 반 전체 나무에 잎이 늘어요
        copy: "앞에서처럼 설계부터 같이 하자. [만들 앱] 우리 반 독서 나무 — 학생은 번호를 고르고 책 제목과 한 줄 느낌을 남겨. 반 전체 기록 수만큼 화면의 나무에 잎이 늘어나. 교사는 시트에서 모든 기록을 보고, 부적절한 글은 '숨김'으로 표시할 수 있어. 먼저 화면 구성, 시트 탭과 열 구성, 동작 순서를 표로 정리해 줘. 코드는 아직 쓰지 마."
    note: { title: "[복사]를 누르면 설계 요청문 전체가 복사돼요" }


# 「경북AI배움터 × 경북형 웍스AI」 발표 슬라이드
# 표지 · 강사 소개(PDF만) · 감사합니다 장은 자동으로 붙어요.
lesson: gb-aischool-worksai
badge: 경북 초등 교원 연수
title: "경북AI배움터 ×\n경북형 웍스AI"
parts:
  - "1부  경북AI배움터, 에듀테크를 한곳에"
  - "2부  경북형 웍스AI, 업무는 가볍게"
  - "3부  둘을 이어 수업으로"
cover: /images/gb-aischool-worksai/hero.jpg
thanks: "실습 요청문 · 가상 자료 · 패들렛은 언제든 이 주소에서 다시 볼 수 있어요."

slides:
  - type: guide
    title: 연수 안내
    have:
      - "📘  오늘 교안 (웹 · PDF)"
      - "💬  실습 요청문 복사 · 내려받기"
      - "📄  가상 공문 · 실습 재료"
      - "🧷  실습 패들렛 바로가기"
    need:
      - { title: 노트북, text: 휴대폰보다 노트북이 편해요 }
      - { title: 경북AI배움터 계정, text: "aischool.gbe.kr · 교직원 로그인" }
      - { title: 경북형 웍스AI 계정, text: "gov.wrks.ai · 로그인 후 ‘에이전트’" }
      - { title: 실습 패들렛, text: 교안의 ‘자료 내려받기’에서 }

  - type: flow
    title: 오늘의 흐름 (90분)
    columns:
      - label: 1부 · 25분
        title: 경북AI배움터
        items: [첫 화면 위젯, 목적별 에듀테크, 강의실 · 학급 관리, 자료실 · 대시보드]
      - label: 2부 · 40분
        title: 경북형 웍스AI
        items: [화면과 에이전트, 업무 효율화 4가지, 수업 활용 4가지, 나만의 에이전트]
      - label: 3부 · 15분
        title: 잇기와 닫기
        items: [웍스AI 문항 → 배움터, 대시보드로 확인, 안전하게 쓰는 5가지, 소감 나누기]
    note:
      title: 듣기보다 눌러 보는 시간이 더 길어요
      text: 시작 전에 두 사이트 로그인부터 해 두세요

  - type: break
    title: "요즘 가장 시간이 많이 드는\n업무 한 가지는?"
    text: "패들렛 ‘0 시작’ 칸에 댓글로 남겨 주세요 · 2부 실습②에서 웍스AI에게 맡겨 봐요"

  - type: list
    tag: 열기
    title: 왜 ‘경북형’ 플랫폼일까
    image: /images/gb-aischool-worksai/slides/onekey.jpg
    items:
      - { title: 교육청 계정 하나로, text: 여러 AI 모델과 교육용 에이전트를 }
      - { title: 입력은 AI 학습에 안 씀, text: 웍스AI 안내 기준 }
      - { title: 한글(HWP) 파일 그대로, text: "읽고, 결과도 한글 파일로" }
    note:
      title: 그래도 개인정보는 처음부터 넣지 않기
      text: "화면 아래 늘 보이는 문구 · “개인정보 등 민감정보는 입력·업로드하지 마세요.”"

  - type: section
    part: 1부
    title: "경북AI배움터,\n에듀테크를 한곳에"
    lead: 교사 · 학생 통합 학습 플랫폼
    items: [첫 화면 위젯 꾸미기, 목적별 에듀테크 고르기, 나의 강의실 · 학급 관리, 자료실 · 학습 분석 대시보드]
    image: /images/gb-aischool-worksai/slides/widgets.jpg

  - type: steps
    tag: 첫 화면
    title: 첫 화면을 내 수업에 맞게
    steps:
      - { title: 위젯 편집하기, text: "첫 화면\n오른쪽 위 버튼" }
      - { title: "[수정하기]", text: "자주 쓸 서비스만\n앞으로 꺼내기" }
      - { title: 바로가기, text: "통합검색 ·\n학급 관리" }
      - { title: 아래로 내리면, text: "학사일정 · 급식표 ·\n공지사항 · FAQ" }

  - type: table
    tag: 에듀테크
    title: 20여 종, 수업 목적으로 고르기
    head: [목적, 서비스]
    rows:
      - [AI 도움, "자작자작(글쓰기 피드백) · 마타수학 · **코들(자동 채점)** · 위툰 · 브루 · AI 마음일기"]
      - [수업 참여, "**띵커벨** · 젭 퀴즈 · 퀴즈앤 · 클래스게임"]
      - [만들기, "캔바 · 미리캔버스 · 북크리에이터 · 노션"]
      - [영어, "리딩앤 · 보카트레인"]
      - [교과서 연계, "아이스크림 · T셀파 · 비바샘 · 엠티처 · Y클라우드 등"]
    note:
      title: "사용법은 이용 안내 › 안내 자료실"
      text: 띵커벨 유료 이용권은 공모로 나눠요 · 공지사항에서 차수별 안내 확인

  - type: list
    tag: 강의실 · 자료실
    title: 수업 준비부터 확인까지, 배움터 안에서
    image: /images/gb-aischool-worksai/slides/toolbox.jpg
    items:
      - { title: 나의 강의실, text: "웨일 클래스 · 구글 클래스룸에 한곳에서" }
      - { title: 학급 관리, text: "우리 반 학생 계정 · 교사 매뉴얼은 안내 자료실" }
      - { title: 수업 · 학습 자료실, text: 다른 선생님 자료를 복사해 고쳐 쓰기 }
      - { title: 학습 분석 대시보드, text: "퀴즈 · 과제 · 게시판 참여를 한눈에" }

  - type: steps
    tag: 실습 ①
    title: 내 첫 화면 만들기 (10분)
    steps:
      - { title: 위젯 편집하기, text: "첫 화면\n오른쪽 위" }
      - { title: 서비스 4개 앞으로, text: "에듀테크 칸의\n[수정하기]에서" }
      - { title: AI 서비스 들어가기, text: "코들 또는\n자작자작" }
      - { title: 패들렛에 댓글, text: "‘고른 서비스 +\n쓸 수업’" }

  - type: section
    part: 2부
    title: "경북형 웍스AI,\n업무에 맞춘 AI 동료"
    lead: 카드를 눌러 바로 시작하는 에이전트
    items: [화면 구성과 에이전트 세 탭, 업무 효율화 4가지, 수업 활용 4가지, 나만의 에이전트]
    image: /images/gb-aischool-worksai/slides/agents.jpg

  - type: compare
    tag: 에이전트
    title: 에이전트 화면의 세 탭
    columns:
      - title: 웍스 공식
        items: [우리 업무 맞춤존, 문서 · 글쓰기 스튜디오, 크리에이티브 · 홍보 스튜디오]
      - title: 경상북도교육청
        items: ["업무 · 법령 검색, 개인정보 Q&A", "자체 제작 · 학교는 가볍게 업무비서", 가정통신문 검토]
      - title: 나만의 에이전트
        items: [자주 쓰는 지시문 저장, 단추 하나로 다시 쓰기]
    note:
      title: 에이전트 = 지시문과 도구를 미리 넣어 둔 AI
      text: "긴 요청문 없이 카드를 눌러 시작 · 입력창 + 단추로 PDF · 한글 파일 올리기"

  - type: steps
    tag: 업무 ①
    title: 가정통신문 · 행사 알리미
    steps:
      - { title: 빈칸 채우기, text: "날짜 · 장소 · 대상 ·\n준비물 · 회신" }
      - { title: 표준 서식, text: "문서번호부터\n회신란까지" }
      - { title: 세 가지 한 번에, text: "학부모용 · 학생용 ·\n알림장용" }
      - { title: 직접 확인, text: "날짜 · 비용 ·\n준비물" }
    note:
      title: "📍 웍스 공식 › 우리 업무 맞춤존"
      text: "보내기 전 규정 · 문법 검토는 경상북도교육청 탭 ‘가정통신문’ 에이전트로"

  - type: list
    tag: 업무 ②
    title: 긴 공문은 요약, 민원은 초안
    image: /images/gb-aischool-worksai/slides/summary.jpg
    items:
      - { title: 요약 · 정리의 달인, text: "+ 단추로 공문 PDF · 한글 파일 올리기" }
      - { title: 3줄 요약 + 할 일 · 마감일, text: "담임교사 입장에서, 학부모 안내 내용까지" }
      - { title: 민원 답변 도우미, text: "공감 → 근거 → 안내, 법령 조 번호까지" }
    note:
      title: "이름 · 연락처는 지우고, 마감일 · 법령은 원문과 대조"

  - type: list
    tag: 업무 ③ ④
    title: 교육청 에이전트, 대화 예약, 번역
    items:
      - { title: 학교는 가볍게 업무비서, text: "번호만 고르면 기안문 · 계획서를 한글 파일로 (길라잡이 근거 쪽까지)" }
      - { title: 학교는 가볍게 행정실 비서, text: "지출 · 계약 · 예산 업무 처리 순서" }
      - { title: 대화 예약, text: "반복 업무를 정해진 시간에 자동으로 · 예) 매주 월요일 알림장 초안" }
      - { title: 문서 번역 · 만능 번역가, text: "가정통신문을 학부모 모국어로 · 가능하면 원어민 확인" }

  - type: steps
    tag: 실습 ②
    title: 내 업무 하나 줄이기 (10분)
    steps:
      - { title: 업무 맡기기, text: "패들렛에 적은 업무를\n알맞은 에이전트에" }
      - { title: 고칠 곳 1군데, text: "결과를\n그대로 쓰지 않기" }
      - { title: 요청문 나누기, text: "잘 된 요청문은 패들렛\n‘2 웍스AI 업무’ 칸에" }

  - type: prompts
    tag: 수업 활용
    title: 수업 준비도 웍스AI로
    items:
      - title: 수업 · 자율시간 설계사
        text: 초등 5학년 학교자율시간 ‘우리 고장 AI 탐험대’ 8차시 운영계획을 차시별 활동 · 성취기준 · 과정 중심 평가 표로 짜 줘.
      - title: 통계로 수업하기
        text: 우리 지역 인구 변화를 그래프로 탐구하는 활동지를 만들어 줘. 탐구 질문 3단계와 교사용 도움말도 함께.
      - title: 그림 스튜디오
        text: 수업 자료에 넣을 그림을 흰 배경 클립아트로 만들어 줘. 글자는 넣지 말아 줘.
    note: { title: "성취기준 코드 · 통계 숫자는 원본과 대조" }

  - type: list
    tag: 수업 활용 ④
    title: 평어 작성 도우미는 ‘초안’까지만
    image: /images/gb-aischool-worksai/slides/privacy.jpg
    items:
      - { title: "과세특 · 평어 / 행발 · 창체 작성기", text: "NEIS 글자 수 · 금지 표현 · 종결 규칙" }
      - { title: "우수 · 보통 · 기초 3수준", text: 관찰한 사실만 익명으로 넣기 }
      - { title: 그대로 붙여 넣지 않기, text: 내가 관찰한 사실로 직접 고쳐 쓰기 }

  - type: steps
    tag: 실습 ③
    title: 수업 자료 하나 만들기 (10분)
    steps:
      - { title: 한 차시 고르기, text: "다음 주\n내 수업에서" }
      - { title: 웍스AI로 만들기, text: "활동지 또는\n퀴즈 문항 5개" }
      - { title: 패들렛에 올리기, text: "‘3 웍스AI 수업’ 칸에\n결과 캡처" }
    note:
      title: 같은 말을 자주 덧붙이면 → 나만의 에이전트
      text: "예) 우리 학년 알림장 말투 · 학급 신문 기사 다듬기 · 수업 나눔 협의록 정리"

  - type: section
    part: 3부
    title: "웍스AI → 배움터,\n수업으로 잇기"
    lead: 만들고, 고치고, 수업하고, 확인하기
    items: [웍스AI로 문항 초안, 교사가 검토 · 수정, "코들 · 띵커벨로 수업", 대시보드로 참여 확인]
    image: /images/gb-aischool-worksai/slides/bridge.jpg

  - type: steps
    tag: 실습 ④
    title: 두 도구를 이어서 쓰기 (10분)
    steps:
      - { title: 웍스AI, text: "확인 문제 5개\n객관식 3 · 서술형 2" }
      - { title: 교사가 검토, text: "정답과 문장\n확인하고 고치기" }
      - { title: 배움터로, text: "코들(자동 채점)\n띵커벨 · 퀴즈앤" }
      - { title: 대시보드, text: "수업 뒤\n참여 현황 확인" }
    note:
      title: 요청문
      text: "“초등 [학년] [단원] 확인 문제 5개를 만들어 줘. 객관식 3개와 서술형 2개, 정답과 해설 포함.”"

  - type: quiz
    tag: 퀴즈
    title: 이 내용, 웍스AI에 넣어도 될까요?
    options:
      - { label: A, title: "가상 자료로 만든\n가정통신문 재료", text: "날짜 · 장소 · 준비물" }
      - { label: B, title: "학생 이름과 성적이 든\n평가 기록", text: 개인정보 · 민감정보 }
    answer:
      title: A는 괜찮고, B는 넣지 않아요
      text: 자동 가림 기능이 있어도, 처음부터 넣지 않는 것이 원칙

  - type: list
    tag: 닫기
    title: AI 안전하게 쓰는 다섯 가지
    items:
      - { title: 학생 정보는 넣지 않기, text: "이름 · 주민번호 · 연락처 · 성적" }
      - { title: AI 결과는 초안, text: 최종 책임은 교사 }
      - { title: 출처 한 번 더, text: "법령 · 통계 · 사실 확인" }
      - { title: 생기부는 관찰 사실로, text: 직접 고쳐 쓰기 }
      - { title: 학생용 서비스는 동의 절차, text: 학교 개인정보 동의 확인 }

  - type: break
    title: 오늘 하나만 가져간다면?
    text: "내일 써 볼 기능 하나와 궁금한 점을 패들렛 ‘6 질문 · 소감’ 칸에"

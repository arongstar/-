# 「웨일 클래스로 우리 반 온라인 교실 만들기」 발표 슬라이드
# 표지 · 강사 소개(PDF만) · 감사합니다 장은 자동으로 붙어요.
lesson: whale-class
badge: 웨일 스페이스 · 초등 교원 연수
title: "웨일 클래스로\n우리 반 온라인 교실 만들기"
parts:
  - "1부  우리 반 클래스 열기"
  - "2부  차시 수업과 복습 퀴즈"
  - "3부  과제로 평가하고, 학급 운영까지"
cover: /images/covers/whale-class.jpg
thanks: "설계 활동지 · 프롬프트 · 헬프센터 링크는 온라인 교안에서 언제든 다시 볼 수 있어요."

slides:
  - type: guide
    title: 연수 안내
    have:
      - "📘  오늘 교안 (웹 · PDF)"
      - "📝  우리 반 클래스 설계 활동지"
      - "💬  프롬프트 4개 [복사]"
      - "🔗  웨일 헬프센터 바로가기"
    need:
      - { title: 노트북 + 웨일 브라우저, text: "웨일북이면 그대로 OK" }
      - { title: 웨일 스페이스 계정, text: "교육청 · 학교에서 받은 아이디" }
      - { title: 이번 주 가르칠 단원 하나, text: "성취기준 · 학습 문제 정도" }
      - { title: 설계 활동지, text: "교안의 ‘자료 내려받기’에서" }

  - type: flow
    title: 오늘의 흐름 (2시간)
    columns:
      - label: 1부 · 30분
        title: 우리 반 클래스 열기
        items: [웨일 스페이스 한눈에, "실습① 클래스 개설", "실습② 과목 게시판 · 단원 챕터", 학생 초대 5가지]
      - label: 2부 · 30분
        title: 차시 수업과 퀴즈
        items: ["실습③ 1차시 수업", 수업 설정 꼭 볼 것, "실습④ 복습 퀴즈 3문항", 자가학습 vs 시험]
      - label: 3부 · 50분
        title: 평가와 학급 운영
        items: ["실습⑤ 성취기준 과제", "피드백 · 다시 제출 · 성적", "실습⑥ 클래스 전용 팀보드", "학급 운영 · 안전 · 학년 말"]
    note:
      title: 오늘 만든 클래스를 내일 우리 반에서 그대로
      text: 연습용이면 이름 앞에 [연습] 을 붙여 두세요

  - type: break
    title: "학생들이 가장 자주 묻는 말,\n“선생님, 그거 어디 있어요?”"
    text: 자료 · 과제 · 공지를 한곳에 모으는 방법을 오늘 함께 만들어요

  - type: section
    part: 1부
    title: "우리 반\n클래스 열기"
    lead: 계정 하나로 여는 온라인 교실
    items: [웨일 스페이스와 웨일 클래스, "클래스 개설 · 기간과 상시", "과목 게시판 · 단원 챕터", 학생 초대 5가지]
    image: /images/whale-class/slides/open.jpg

  - type: table
    tag: 한눈에
    title: 계정 하나로 쓰는 웨일 스페이스
    head: [서비스, 하는 일]
    rows:
      - ["**웨일 클래스**", "수업 · 퀴즈 · 과제 · 평가를 관리하는 온라인 교실 (오늘의 주인공)"]
      - [팀보드, "함께 쓰는 화이트보드 · 클래스 전용 보드"]
      - [웨일온, "설치 없는 화상 수업 · 클래스 전용 회의실"]
      - [네이버 웍스, "메신저 · 메일 · 드라이브 · 학급 소통"]
      - [웨일 브라우저, "학교/기관 로그인 · 퀴즈 집중 모드"]
    note:
      title: 교육청 · 학교에서 받은 아이디 하나로
      text: 웨일북(학생 기기) · 웨일 UBT(디지털 평가)도 같은 계정으로 이어져요

  - type: steps
    tag: 구조
    title: 웨일 클래스는 이렇게 생겼어요
    steps:
      - { title: 클래스, text: "우리 반 하나\n(또는 과목 하나)" }
      - { title: 메뉴 · 게시판, text: "과목마다 하나\n일반형 · 챕터형" }
      - { title: 챕터, text: "단원마다 하나\n끝나면 아래로" }
      - { title: 수업 콘텐츠, text: "차시마다\n수업 · 퀴즈 · 과제" }
    note:
      title: 수업 콘텐츠 다섯 가지
      text: "수업 · 퀴즈 · 과제 · 동료평가 · 퀴즈형 설문"

  - type: steps
    tag: 시작 전
    title: 로그인하고 선생님 권한 확인
    steps:
      - { title: 프로필 아이콘, text: "웨일 브라우저\n오른쪽 위 → 로그인" }
      - { title: 학교/기관, text: "웨일 스페이스\n아이디 · 비밀번호" }
      - { title: 웨일 클래스로, text: "class.whalespace.io\n(학교 북마크도 OK)" }
      - { title: "[클래스 개설하기]", text: "버튼이 보이면\n선생님 권한 OK" }
    note:
      title: 버튼이 없다면?
      text: 학교 웨일 스페이스 관리자에게 선생님 권한을 요청해요

  - type: steps
    tag: 실습 ①
    title: 우리 반 클래스 개설하기 (8분)
    steps:
      - { title: 클래스명, text: "○학년 ○반\n○학년 과학" }
      - { title: 클래스 URL, text: "한 번 정하면\n못 바꿔요" }
      - { title: "커버 · 노출 범위", text: "우리 반만 쓰면\n‘노출 안 함’" }
      - { title: "[개설]", text: "나의 클래스 ›\n운영 클래스" }
    note:
      title: "📍 홈 › 클래스 개설하기"
      text: "또는 나의 클래스 › 클래스 추가하기 › 클래스 개설하기"

  - type: compare
    tag: 꼭 확인
    title: 기간 클래스 vs 상시 클래스
    columns:
      - title: 기간 클래스
        items: ["학기 · 학년 단위 우리 반", "수업 · 퀴즈(시험 · 자가학습)", "**과제 · 동료평가 · 서술형**", 성적 공개 때 수료]
      - title: 상시 클래스
        items: ["언제나 여는 자료방 · 방과후", "수업 · 퀴즈만", "과제 · 동료평가 · 서술형 없음", 기준을 채우면 바로 수료]
    note:
      title: "평가에 쓸 반은 기간 클래스로"
      text: "기간 → 상시로 바꾸면 과제 · 동료평가 · 서술형 문제가 지워져요 · 📍 설정 › 기본 정보"

  - type: list
    tag: 실습 ②
    title: 과목 게시판과 단원 챕터 (7분)
    image: /images/whale-class/slides/shelf.jpg
    items:
      - { title: "설정 › 메뉴 관리 › 메뉴 추가", text: "챕터형 수업 게시판 · 과목 이름 붙이기" }
      - { title: CHAPTER 1~5를 단원으로, text: "이름 바꾸기 · 필요 없으면 삭제 · [챕터 추가]" }
      - { title: 공지 게시판도 하나, text: "계정 안내 · 과제 내는 법 · 자주 묻는 질문" }
      - { title: 끝난 단원은 아래로, text: "≡ 끌어 내리기 · 다 쓴 수업은 비공개" }

  - type: table
    tag: 학생 초대
    title: 학생을 들어오게 하는 다섯 가지
    head: [방법, 어디서 · 특징]
    rows:
      - ["**조직도로 추가**", "설정 › 구성원 관리 › 구성원 추가 · 우리 반을 골라 한 번에 (최대 100명)"]
      - ["**초대 코드**", "설정 › 기본 정보 · 학생이 ‘클래스 참여하기’에 입력 · 승인 없이 바로"]
      - [클래스 URL, "알림장 · 메신저로 공유 · ‘선생님 승인’이면 승인 필요"]
      - [초대장 메일, "설정 › 수강생 초대 관리 · 한 번에 10명 · 자동 승인"]
      - ["직접 · 엑셀", "설정 › 구성원 관리 · 한 명씩 또는 엑셀 샘플 파일"]
    note:
      title: "승인 대기는 📍 설정 › 클래스 참여 관리"
      text: 초대 코드가 밖으로 퍼지면 기본 정보에서 재설정

  - type: quiz
    tag: 퀴즈
    title: 초대 코드로 들어온 학생, 선생님 승인이 필요할까요?
    options:
      - { label: A, title: "필요해요\n하나씩 승인", text: "설정 › 클래스 참여 관리에서" }
      - { label: B, title: "필요 없어요\n바로 참여", text: "코드가 곧 열쇠" }
    answer:
      title: B — 초대 코드는 승인 없이 바로 들어와요
      text: 그래서 코드가 새면 바로 재설정해요 · URL로 들어온 학생은 ‘선생님 승인’일 때 승인 필요

  - type: section
    part: 2부
    title: "차시 수업과\n복습 퀴즈"
    lead: 학습 문제 한 줄, 활동 세 줄이면 충분해요
    items: ["실습③ 1차시 수업 만들기", "수업 설정 · 공개", "실습④ 복습 퀴즈 3문항", 자가학습 vs 시험]
    image: /images/whale-class/slides/lesson.jpg

  - type: steps
    tag: 실습 ③
    title: 1차시 수업 만들기 (15분)
    steps:
      - { title: "[수업 추가]", text: "챕터 아래에서\n제목 → 저장 후 이동" }
      - { title: 요소 넣기, text: "글 · 사진 · 동영상\n링크 · 문서" }
      - { title: 수업 설정, text: "대표 과목 · 학습 시간\n공개 예약" }
      - { title: 공개로 바꾸기, text: "새 수업은\n비공개로 저장돼요" }
    note:
      title: 공개가 안 된다면?
      text: 내용이 비어 있거나 대표 과목을 안 골랐어요

  - type: table
    tag: 수업 요소
    title: 수업에 넣을 수 있는 것
    head: [요소, 이렇게 써요]
    rows:
      - [텍스트, "성취기준 · **학습 문제(크고 굵게)** · 활동 순서 · 중요한 안내는 빨간 글씨"]
      - [이미지, "교과서 쪽 사진 · 판서 사진 · 실험 결과 사진"]
      - [동영상, "직접 찍은 영상 · **목차(00:00)** 와 **재생 구간** 으로 필요한 부분만"]
      - [URL, "유튜브 · e학습터 · 디지털교과서 · 유튜브는 미리보기로"]
      - [문서 · 설문, "활동지(doc · xls · ppt · pdf) · 수업 중 의견 받기"]
    note:
      title: 순서는 끌어서 바꿔요
      text: 동영상 시청률은 직접 올린 영상만 잴 수 있어요 (유튜브 링크는 X)

  - type: list
    tag: 수업 설정
    title: 저장 전에 꼭 볼 네 가지
    items:
      - { title: 대표 과목, text: "꼭 골라야 공개돼요 · 학생 시간표에 과목명으로" }
      - { title: 학습 시간, text: "학생 홈 시간표에 나와요 · 시간 안에만 완료도 가능" }
      - { title: 공개 예약, text: "내일 아침 자료를 오늘 만들어 두기" }
      - { title: 댓글, text: "수업마다 켜고 끄기" }

  - type: prompt
    tag: AI와 함께
    title: 차시 안내문은 AI에게 초안을
    label: 차시 수업 안내문 만들기
    text: |
      너는 초등학교 4학년 담임교사를 돕는 수업 설계 도우미야.
      웨일 클래스 '수업'에 올릴 학생용 안내문을 써 줘.
      [교과·단원] 4학년 과학 · 물의 상태 변화
      [차시] 2차시 · 물이 얼 때 부피와 무게는 어떻게 변할까요?
      [성취기준] (교육과정 성취기준 코드와 문장을 붙여 넣기)
      [활동] 실험 영상 보기 → 결과 표 채우기 → 생각 한 줄 쓰기
      조건: 맨 위에 '오늘의 학습 문제' 한 문장 / 활동 순서 ①②③ 세 줄, 4학년이 읽기 쉬운 말로
      / 끝에 '다 했으면 [학습 완료]를 눌러요' 안내 / 학생 이름 같은 개인정보는 넣지 마

  - type: steps
    tag: 실습 ④
    title: 복습 퀴즈 3문항 만들기 (10분)
    steps:
      - { title: "[퀴즈 추가]", text: "같은 챕터에서\n저장 후 이동" }
      - { title: "[만들기]", text: "질문 · 배점\n보기와 정답" }
      - { title: 정답 풀이, text: "틀린 학생에게\n힌트가 돼요" }
      - { title: 퀴즈 구분, text: "자가학습 또는 시험\n저장 · 공개" }
    note:
      title: "객관식 · 단답형은 자동 채점, 서술형은 선생님이"
      text: "단답형은 ‘유사 정답’ 을 넣으면 띄어쓰기 · 표현 차이도 맞게 · 다른 퀴즈 문제는 [불러오기]"

  - type: compare
    tag: 퀴즈 구분
    title: 자가학습 vs 시험
    columns:
      - title: 자가학습
        items: [성적에 반영 안 함, 기간 · 횟수 제한 없이, 복습 · 연습용]
      - title: 시험
        items: [성적에 반영, 제출 기간 · 횟수 정하기, "**집중 모드** 켤 수 있음"]
    note:
      title: 집중 모드 = 전체 화면에 퀴즈만
      text: "새 탭 · 검색창 · 웨일북 캡처 막힘 · 웨일 브라우저 PC에서만 시작"

  - type: prompt
    tag: AI와 함께
    title: 퀴즈 문항도 웨일 클래스 형식으로
    label: 복습 퀴즈 문항 만들기
    text: |
      4학년 과학 '물의 상태 변화' 2차시(물이 얼 때 부피와 무게 변화) 복습 퀴즈를 만들어 줘.
      웨일 클래스 퀴즈에 바로 옮겨 적을 수 있게 아래 형식으로 써 줘.
      - 객관식 단일선택 2문항, 주관식 단답형 1문항
      - 문항마다: 질문 / 보기 4개(객관식만) / 정답 / 유사 정답(단답형만, 2~3개) / 정답 풀이(한두 문장)
      - 4학년이 읽기 쉬운 말로, 교과서에 나오는 개념만
      - 헷갈리기 쉬운 오개념(예: 얼면 무게가 늘어난다)을 보기에 하나 넣어 줘

  - type: break
    title: 쉬는 시간 (10분)
    text: "3부는 과제 · 피드백 · 성적, 그리고 팀보드예요"
    image: /images/whale-class/slides/tools.jpg

  - type: section
    part: 3부
    title: "과제로 평가하고,\n학급 운영까지"
    lead: 한 번 내고 끝이 아니라, 고치며 자라는 기록
    items: ["실습⑤ 성취기준 과제", "피드백 · 다시 제출 · 성적", "실습⑥ 클래스 전용 팀보드", "학급 운영 · 안전 · 학년 말"]
    image: /images/covers/whale-class.jpg

  - type: steps
    tag: 과정 중심 평가
    title: 과제 한 번이 기록 다섯 단계로
    steps:
      - { title: 과제 만들기, text: "제목에\n성취기준 붙이기" }
      - { title: 학생 제출, text: "제출 · 평가 대기\n· 미제출" }
      - { title: 평가 · 피드백, text: "점수 + 한 줄 의견\n필요하면 다시 제출" }
      - { title: 고쳐서 다시, text: "평가 상태에\n고친 기록이 쌓임" }
      - { title: 성적 탭, text: "과목 · 학생 이름\n검색으로 모아 보기" }
    note:
      title: 쌓인 점수와 고친 기록 = 성장 관찰의 근거
      text: 생활기록부 문장은 이 기록을 보고 선생님이 직접 판단해 써요

  - type: steps
    tag: 실습 ⑤
    title: 성취기준을 붙인 과제 만들기 (10분)
    steps:
      - { title: "[과제 추가]", text: "제목: [성취기준]\n○차시 ○○○" }
      - { title: 과제 안내, text: "학생용 쉬운 말\n이미지 · 문서 · URL" }
      - { title: 필수 설정, text: "배점 · 평가 기준\n제출 기간 · 대표 과목" }
      - { title: 저장 · 공개, text: "기간 클래스에서만\n만들 수 있어요" }
    note:
      title: "평가 기준 = 성취기준별 등급과 점수 (10단계까지)"
      text: "자주 쓰는 기준은 📍 평가 기준 관리 에 저장 · 학교 안에 공개하면 동학년이 [복사]"

  - type: prompt
    tag: AI와 함께
    title: 과제 안내와 평가 기준 초안
    label: 과제 안내와 평가 기준 만들기
    text: |
      4학년 과학 '물의 상태 변화' 단원 과제를 웨일 클래스에 올리려고 해.
      과제: 물이 얼 때와 얼음이 녹을 때 부피·무게 변화를 그림과 글로 설명하기
      1. 학생용 과제 안내를 5줄 이내로 써 줘. (무엇을, 어떻게, 언제까지, 어떻게 제출)
      2. 평가 기준을 '잘함 / 보통 / 노력 요함' 3단계 표로 만들어 줘. 단계마다 관찰할 수 있는 행동으로.
      3. 단계별로 학생에게 줄 피드백 예시를 한 문장씩 써 줘. 따뜻하지만 다음에 할 일이 분명하게.
      학생 이름은 넣지 마.

  - type: list
    tag: 평가
    title: 평가하고 피드백하기
    image: /images/whale-class/slides/feedback.jpg
    items:
      - { title: "성적 › 과제 › 평가", text: "과제 이름 → 제출 · 평가 대기 · 미제출" }
      - { title: "[평가]", text: "점수 · 의견 · 성취도 · 만점이면 [만점 입력]" }
      - { title: 다시 제출 체크, text: "무엇을 고칠지 의견에 적기" }
      - { title: "[즉시 공개] / [임시 저장]", text: "임시 저장은 나중에 골라서 한꺼번에 공개" }
      - { title: 평가 상태, text: "몇 번 고쳤고 몇 점이었는지 기록" }
    note:
      title: "[과제 종료] 는 마지막에"
      text: 누르면 임시 저장이 한꺼번에 공개되고, 과제와 평가를 더 고칠 수 없어요

  - type: list
    tag: 성적
    title: 성적 모아 보기 → 생활기록부 참고
    items:
      - { title: "성적 › 전체성적", text: "과목(게시판)을 고르면 그 과목 과제만" }
      - { title: 학생 이름 검색, text: "한 학생의 과목 점수만 모아 보기" }
      - { title: 비공개 과제는 빠져요, text: "보고 싶은 과제만 · 진도율 · 점수에서도 빠짐" }
      - { title: 과제물 한 번에 받기, text: "성적 › 과제 › 다운로드 · 학생별 · 전체" }

  - type: table
    tag: 동료평가
    title: 친구끼리 서로 평가하기
    head: [설정, 고를 수 있는 것]
    rows:
      - [순서, "과제 제출 → 동료평가 · 본인 평가 → 선생님 검토 → 결과 공개"]
      - [평가 종류, "과제 평가 · 제출 즉시 시작 · 과제 없이 평가"]
      - [평가 방식, "**조별 활동**(모둠 안에서) · **개별 활동**(무작위)"]
      - [블라인드 · 본인 평가, "누구를 평가하는지 감추기 · 자기 평가는 점수에 안 들어감"]
      - [기간, "과제 제출이 끝난 **다음 날부터**"]
    note:
      title: 초등은 블라인드 + 3단계 기준 + 칭찬 한 줄로 시작
      text: 결과를 학생에게 공개할지는 선생님이 정해요

  - type: list
    tag: 실습 ⑥
    title: 클래스 전용 팀보드로 생각 모으기 (8분)
    image: /images/whale-class/slides/teamboard.jpg
    items:
      - { title: "[팀보드 생성]", text: "클래스 위쪽 회색 버튼" }
      - { title: 우리 반 모두 편집 가능, text: "링크 없이 [팀보드] 버튼으로" }
      - { title: 보드 이름 바꾸기, text: "‘2차시 생각 모으기’ 처럼" }
      - { title: "스티키 노트 · 이모티콘", text: "웨일북은 펜으로 드로잉" }
    note:
      title: "학생 권한: 편집 / 읽기 / 접근 제한"
      text: 팀보드 연결을 해제하면 다시 이 클래스에 연결할 수 없어요

  - type: table
    tag: 학급 운영
    title: 학급 운영에 쓰는 기능
    head: [기능, 어디서 · 메모]
    rows:
      - [수업도구, "클래스 왼쪽 맨 아래 · 스톱워치 · 타이머 · 사다리타기 · 칠판 · 번호뽑기 · 점수판"]
      - [웨일온 회의실, "클래스 위쪽 [웨일온 수업 개설] · 대기실 켜기 · 링크 새면 재설정"]
      - [온라인 조종례, "홈 › 톱니바퀴 › 주간 조종례 설정 · 10~60분 · 참석 현황 엑셀"]
      - [설문 조사, "설정 › 설문 조사 · 한 번에 한 개 · 종료하면 다시 못 열어요"]
      - [학습 현황, "홈 또는 성적 › 학습 현황 · 학습 완료 · 동영상 재생률"]
    note:
      title: 동학년이 같은 진도라면
      text: "한 분이 단원을 만들고 ‘내보내기’ 로 나누기 · 내 다른 클래스 수업은 ‘콘텐츠함’ 으로 가져오기"

  - type: quiz
    tag: 퀴즈
    title: 학년 말, 기록이 남아야 하는 우리 반 클래스는?
    options:
      - { label: A, title: "보관", text: "고칠 수 없게 잠그고\n학생은 성적만 보기" }
      - { label: B, title: "폐쇄", text: "영구 삭제\n(7일 유예)" }
    answer:
      title: A 보관 — 클래스 보관함에서 언제든 복원할 수 있어요
      text: 연습용 클래스는 폐쇄로 정리 · 폐쇄는 유예 기간이 지나면 되돌릴 수 없어요

  - type: list
    tag: 안전하게
    title: 안전하게 쓰는 여섯 가지
    items:
      - { title: 노출은 좁게, text: "노출 안 함 · 클래스 내용 [공개하기] 끄기" }
      - { title: 교과서 자료는 우리 반 안에서, text: "공개 클래스 · 우리 스페이스로 넓히지 않기" }
      - { title: 코드 · 링크가 새면 재설정, text: "초대 코드 · 웨일온 회의 링크" }
      - { title: 개인정보는 최소로, text: "설문 ‘개인정보 항목’ · AI에 학생 이름 X" }
      - { title: 지우기보다 비공개, text: "삭제한 수업은 되살리기 어려워요" }
      - { title: 되돌릴 수 없는 버튼, text: "과제 종료 · 성적 공개 · 팀보드 연결 해제 · 상시로 바꾸기" }

  - type: break
    title: "다음 주,\n한 단원만 웨일 클래스로"
    text: "수업 한 번 · 퀴즈 한 번 · 과제와 다시 제출 한 번까지 해 보기"
    image: /images/whale-class/slides/invite.jpg

# 「AI 에이전트로 학교 업무 자동화하기」 발표 슬라이드
# 표지 · 강사 소개(PDF만) · 감사합니다 장은 자동으로 붙어요.
lesson: ai-agent-automation
badge: 디지털·AI 교원 연수
title: "AI 에이전트로\n학교 업무 자동화하기"
parts:
  - "1부  챗봇과 에이전트, 클로드 코드 실습"
  - "2부  AI 브라우저 실습, 우리 학교에 적용하기"
cover: /images/ai-agent-automation/hero.jpg
thanks: "교안 · 예시 프롬프트 · 실습 파일은 언제든 이 주소에서 다시 볼 수 있어요."

slides:
  - type: guide
    title: 연수 안내
    have:
      - "📘  오늘 교안 (웹 · PDF)"
      - "💬  예시 프롬프트 복사 · 내려받기"
      - "📦  실습 파일 묶음 · 활동지"
      - "🔗  오늘 소개한 사이트 모음"
    need:
      - { title: 노트북, text: "Windows 또는 Mac (태블릿은 어려워요)" }
      - { title: Claude 유료 계정, text: "Pro 이상 · 없으면 짝과 함께" }
      - { title: Claude 데스크톱 앱 + 크롬, text: "또는 무료 AI 브라우저 Comet" }
      - { title: 실습 파일, text: "내려받아 바탕화면에 압축 풀기" }

  - type: flow
    title: 오늘의 흐름
    columns:
      - label: 1부 앞
        title: 챗봇과 에이전트
        items: [무엇이 다를까, 오늘 쓰는 두 에이전트, 어디에 맡길까, 여섯 가지 약속]
      - label: 1부 뒤
        title: 클로드 코드 실습
        items: [회신서 합치기, 설문 분석 보고서, 사진 파일 정리, 우리 반 도구 만들기]
      - label: 2부
        title: AI 브라우저와 적용
        items: [AI 브라우저 두 가지, 조사 · 요약 · 설문지, 두 에이전트 이어 쓰기, 우리 학교 업무에 적용]
    note: { title: "쉬는 시간은 1부와 2부 사이에" }

  - type: section
    part: 1부
    title: "챗봇과 에이전트,\n무엇이 다를까"
    lead: 말해 주는 AI에서, 해 주는 AI로
    items: ["챗봇은 말하고, 에이전트는 함", 오늘 써 볼 두 에이전트, 어떤 일을 어디에 맡길까, 맡기기 전 여섯 가지 약속]
    image: /images/ai-agent-automation/slides/agent.jpg

  - type: compare
    tag: 비유
    title: 챗봇은 말해 주고, 에이전트는 해 줌
    columns:
      - image: /images/ai-agent-automation/slides/chatbot.jpg
        caption: "챗봇: 방법은 알려 주지만, 일은 결국 내가"
      - image: /images/ai-agent-automation/slides/agent.jpg
        caption: "에이전트: 목표만 주면 파일을 만들어 돌려줌"
    note:
      title: 계획 → 실행 → 확인을 스스로 반복
      text: 파일을 열고, 새로 만들고, 클릭하고, 틀리면 다시 고침

  - type: table
    tag: 한 장 정리
    title: 오늘 써 볼 에이전트 두 가지
    head: ["", 클로드 코드, AI 브라우저]
    rows:
      - [일하는 곳, "**내 컴퓨터 폴더**", "**인터넷 웹사이트**"]
      - [하는 일, "파일 읽기 · 만들기 · 정리 · 계산", "클릭 · 입력 · 탭 이동 · 페이지 읽기"]
      - [잘 맞는 업무, "회신서 집계, 설문 분석, 파일 정리", "자료 조사 · 비교, 양식 만들기, 요약"]
      - [대표 도구, "Claude 데스크톱 앱의 Code", "Claude in Chrome, Comet"]
    note:
      title: 이름에 '코드'가 있어도, 코딩은 몰라도 됨
      text: 우리말로 시키면 필요한 프로그램은 AI가 짜서 실행

  - type: compare
    tag: 나누기
    title: 어떤 일을 어디에 맡길까
    columns:
      - title: 클로드 코드
        items: [엑셀 · 한글 · 사진 파일, 집계 · 정리 · 보고서, 간단한 교실 도구]
      - title: 사람이 직접
        items: [나이스 · 업무포털, 민감한 학생 정보, 최종 판단과 제출]
      - title: AI 브라우저
        items: [여러 사이트 조사 · 비교, 열린 탭 요약, 설문지 · 양식 초안]

  - type: list
    tag: 약속
    title: 에이전트에게 맡기기 전, 여섯 가지 약속
    image: /images/ai-agent-automation/safety.jpg
    items:
      - { title: 복사본에서 시작, text: 원본 파일은 그대로 두기 }
      - { title: 개인정보는 최소로, text: 번호 · 가명으로 바꾸기 }
      - { title: 중요한 행동은 내가 승인, text: "삭제 · 전송 · 제출 · 결제 전에" }
      - { title: 행정 시스템엔 맡기지 않기, text: "나이스 · 업무포털 · 은행" }
      - { title: 웹 속 숨은 지시 조심, text: 처음 보는 사이트는 지켜보기 }
      - { title: 결과는 원본과 대조, text: "인원 · 이름 · 날짜는 직접 확인" }

  - type: section
    part: 실습 ①
    title: "클로드 코드로\n파일 업무 맡기기"
    lead: 내 컴퓨터 폴더에서 일하는 에이전트
    items: [반마다 다른 회신서 합치기, 설문 결과 분석 보고서, 행사 사진 파일 정리, 우리 반 모둠 도구 만들기]
    image: /images/ai-agent-automation/slides/folder.jpg

  - type: steps
    tag: 따라 하기
    title: 클로드 코드 시작하기
    steps:
      - { title: 앱 열기, text: "Claude 데스크톱 앱\n실행 · 로그인" }
      - { title: Code 고르기, text: "왼쪽 메뉴에서\nCode 선택" }
      - { title: 폴더 고르기, text: "압축 푼\n실습 파일 폴더" }
      - { title: 말로 시키기, text: "허락 창이 뜨면\n읽고 [허용]" }
    note:
      title: "첫마디는 '살펴보기만'"
      text: "“이 폴더에 무엇이 있는지 설명해 줘. 아직 아무것도 고치지 마.”"

  - type: list
    tag: CLAUDE.md
    title: CLAUDE.md = 우리 학교 업무 규칙집
    image: /images/ai-agent-automation/slides/rules.jpg
    items:
      - { title: 일 시작 전에 먼저 읽음, text: 폴더에 두면 매번 자동으로 }
      - { title: 한 번 적으면 계속 지킴, text: "‘원본은 고치지 말 것’ ‘결과는 결과 폴더에’" }
      - { title: 나에게 맞게 함께 만들기, text: "“질문 5개를 하나씩 하고, 규칙을 제안해 줘”" }

  - type: steps
    tag: 실습 1
    title: 반마다 다른 회신서, 한 번에 합치기
    steps:
      - { title: 세 반 회신서, text: "열 이름 · 표시가\n반마다 제각각" }
      - { title: 표시 통일, text: "O/X, 예/아니오를\n‘참가 · 불참’으로" }
      - { title: 명렬표와 대조, text: "미제출 · 중복 ·\n띄어쓰기 실수 찾기" }
      - { title: 엑셀 한 파일, text: "시트 4개 +\n반별 안내 메모" }
    note:
      title: 꼭 할 일 · 반별 인원수 직접 대조
      text: "“시작하기 전에 계획을 먼저 보여 줘. 원본은 고치지 마.”"

  - type: list
    tag: 실습 2
    title: 설문 응답 파일 하나로 보고서까지
    items:
      - { title: 반별 응답 비율 표, text: 문항마다 엑셀로 비교 }
      - { title: 눈에 띄는 결과 3가지, text: 예) 스마트폰 사용 시간이 많은 반 }
      - { title: 자유 의견 주제별로 묶기, text: 비슷한 의견끼리, 몇 건인지 }
      - { title: 막대그래프 2개, text: 한글이 깨지면 “다시 그려 줘” }
      - { title: A4 한 장 요약 보고서, text: 학년 협의회용 워드 파일 }
    note:
      title: 틀리면 스스로 고치는 게 에이전트의 강점
      text: "“그래프 한글이 깨졌어. 한글 글꼴을 찾아서 다시 그려 줘.”"

  - type: list
    tag: 실습 3
    title: 사진 정리는 계획 먼저, 실행은 승인 뒤
    image: /images/ai-agent-automation/slides/plan.jpg
    items:
      - { title: 날짜로 행사 알아내기, text: "IMG_ · KakaoTalk_ 사진 + 학사일정" }
      - { title: 바뀔 이름을 표로만 먼저, text: "2026-10-21_현장체험학습_01.jpg" }
      - { title: "내가 “진행해”라고 하면", text: 그때 복사 시작 · 원본은 그대로 }

  - type: steps
    tag: 실습 4
    title: 말로 만드는 우리 반 모둠 도구
    steps:
      - { title: 말로 설명, text: "4명씩, 남녀 골고루,\n글씨는 크게" }
      - { title: AI가 만듦, text: "HTML 파일 하나\n인터넷 없이도 열림" }
      - { title: 써 보고 고치기, text: "“동물 이름 모둠”\n“인쇄 버튼도”" }
      - { title: 교실 TV에, text: "버튼 한 번에\n새 모둠" }
    note: { title: "코드는 AI 몫, 선생님은 무엇을 원하는지만" }

  - type: list
    tag: 요령
    title: 일 잘 맡기는 다섯 가지 요령
    items:
      - { title: 결과물로 말하기, text: "‘정리해 줘’보다 ‘시트 4개짜리 엑셀로’" }
      - { title: 재료 위치 알려 주기, text: 어느 폴더의 어떤 파일인지 }
      - { title: 규칙 정하기, text: "원본 보존 · 개인정보 · 저장 위치" }
      - { title: 계획 먼저, text: "“시작하기 전에 계획을 보여 줘”" }
      - { title: 확인 방법 요구하기, text: "“원본과 인원수가 맞는지 확인해 줘”" }

  - type: break
    title: 잠깐 쉬어 갈까요?
    text: "다음 시간 · AI 브라우저로 웹 업무 맡기기"

  - type: section
    part: 2부
    title: "AI 브라우저로\n웹 업무 맡기기"
    lead: 보고, 클릭하고, 입력하는 에이전트
    items: [오늘 고를 AI 브라우저, 조사 · 요약 · 설문지 만들기, 맡겨도 될까? 퀴즈, 두 에이전트 이어 쓰기]
    image: /images/ai-agent-automation/browser.jpg

  - type: compare
    tag: 도구
    title: 오늘 고를 AI 브라우저 두 가지
    columns:
      - title: Claude in Chrome
        items: [평소 쓰는 크롬에 확장 프로그램, Claude 유료 요금제 필요, 사이트마다 허락받고 일함]
      - title: Comet (퍼플렉시티)
        items: [AI가 들어 있는 새 브라우저, 무료로 시작 (사용량 제한), 설치하고 바로 시키기]
    note:
      title: 학교 계정 · 요금제는 먼저 확인
      text: 크롬의 Gemini, ChatGPT 에이전트도 비슷하지만 제공 범위가 서로 달라요

  - type: prompts
    tag: 실습 5~7
    title: 이렇게 시켜 보기
    items:
      - title: 체험학습 장소 비교
        text: 후보 4곳의 공식 홈페이지에서 단체 예약 방법 · 관람료 · 휴관일을 확인해 표로 정리해 줘. 근거 주소도 함께, 못 찾은 칸은 ‘확인 필요’로.
      - title: 열린 탭 요약 → 할 일 목록
        text: 열린 탭에서 3학년 담임에게 필요한 내용만 골라, 마감 날짜순 할 일 목록으로 만들어 줘.
      - title: 구글 설문지 초안
        text: 현장체험학습 참가 동의서 설문지를 만들어 줘. 만들기만 하고, 공유하거나 보내지는 마.
    note: { title: "모으고 만드는 건 AI, 보내고 제출하는 건 선생님" }

  - type: quiz
    tag: 퀴즈
    title: 이 일, AI 브라우저에 맡겨도 될까요?
    options:
      - { label: A, title: "교육청 연수 공고를\n모아 표로 정리", text: 공개된 정보를 읽고 모으기 }
      - { label: B, title: "나이스에 로그인해\n성적 입력하기", text: 행정 시스템 · 학생 정보 }
    answer:
      title: A는 맡기기 좋고, B는 선생님이 직접
      text: 중요한 사이트에 로그인한 채로 AI 브라우저에 일을 맡기지 않아요

  - type: list
    tag: 이어 쓰기
    title: 모으는 건 브라우저, 문서는 클로드 코드
    image: /images/ai-agent-automation/slides/relay.jpg
    items:
      - { title: AI 브라우저로 조사, text: 체험학습 장소 비교표 만들기 }
      - { title: 결과를 복사해 넘기기, text: 표 내용을 그대로 붙여넣기 }
      - { title: 클로드 코드로 문서, text: "가정통신문 초안(.docx) + 회신서 절취선" }

  - type: list
    tag: 적용
    title: 우리 학교 업무에 적용하기
    image: /images/ai-agent-automation/slides/apply.jpg
    caption: 활동지는 교안 사이트 ‘자료 내려받기’에
    items:
      - { title: 반복 업무 적기, text: 한 달 동안 되풀이하는 일 }
      - { title: 어디서 일어나는 일인지, text: "파일 / 웹 / 학교 시스템" }
      - { title: 지시문 설계, text: "목표 · 재료 · 규칙 · 결과물 · 확인 방법" }
      - { title: 복사본으로 시켜 보기, text: 옆 선생님과 결과 나누기 }

  - type: list
    tag: 마무리
    title: 말해 주는 AI에서, 해 주는 AI로
    image: /images/ai-agent-automation/finish.jpg
    items:
      - { title: 목표는 정확히, text: "결과물 · 재료 · 규칙으로 말하기" }
      - { title: 중요한 순간은 승인, text: "삭제 · 전송 · 제출 전에는 내가" }
      - { title: 결과는 내가 확인, text: 원본과 대조하기 }
      - { title: 작은 일부터, text: 가상 데이터와 복사본으로 연습 }

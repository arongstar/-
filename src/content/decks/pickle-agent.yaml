# 「피클(Pickle) — 전화·예약을 대신해 주는 휴대폰 AI 에이전트」 발표 슬라이드 (50분)
# 표지 · 강사 소개(PDF만) · 감사합니다 장은 자동으로 붙어요.
lesson: pickle-agent
badge: AI 에이전트 · 초등 교원 연수
title: "피클(Pickle),\n전화·예약을 대신해 주는 AI"
parts:
  - "1부  피클은 무엇일까"
  - "2부  시작하고, 일 맡기기"
  - "3부  안전하게 · 함께 생각하기"
cover: /images/covers/pickle-agent.jpg
thanks: "실습 문장과 안전 수칙은 온라인 교안에서 언제든 다시 볼 수 있어요."

slides:
  - type: guide
    title: 연수 안내
    have:
      - "📘  오늘 교안 (웹 · PDF)"
      - "💬  실습 문장 5개 [복사]"
      - "🔗  피클 공식 도움말"
      - "🧭  Aside 교안과 비교"
    need:
      - { title: "스마트폰", text: "아이폰 · 안드로이드" }
      - { title: "휴대폰 번호", text: "가입할 때" }
      - { title: "짝 선생님 한 분", text: "실습④ 약속 잡기" }
      - { title: "약속 하나", text: "같은 곳에 다 같이 전화 걸지 않기" }

  - type: flow
    title: 오늘의 흐름 (50분)
    columns:
      - label: 1부 · 10분
        title: 피클은 무엇일까
        items: ["할 수 있는 일", "Aside와 다른 점", "화면 한눈에"]
      - label: 2부 · 30분
        title: 시작하고 맡기기
        items: ["실습① 안전 설정 먼저", "실습② 기차 시간 찾기", "실습③ 확인 카드 거절", "실습④ 협의 시간 맞추기"]
      - label: 3부 · 10분
        title: 안전 · 생각하기
        items: ["안전하게 쓰는 일곱 가지", "AI가 전화한다면?", "내일 해 볼 일"]
    note:
      title: "⚠ 약관 만 16세 이상 · 도움말 18세 이상"
      text: "초등학생은 쓸 수 없어요 · 오늘은 선생님 개인 생활 업무용"

  - type: section
    part: 1부
    title: "피클은\n무엇일까"
    lead: 말로 부탁하면, 웹에서 하고 안 되면 전화까지
    items: ["예약 · 신청 · 주문 · 해지", "대신 전화", "친구 피클과 약속 잡기", "반복 작업"]
    image: /images/pickle-agent/slides/call.jpg

  - type: steps
    tag: 흐름
    title: 일을 맡기면 이렇게 흘러가요
    steps:
      - { title: "말로 부탁", text: "채팅 · 음성 통화" }
      - { title: "필요한 것만 질문", text: "인원 · 날짜 ·\n고를 것" }
      - { title: "확인 카드", text: "무엇을 · 얼마에\n승인 / 거절" }
      - { title: "작업 카드", text: "진행 상황 보기\n앱을 닫아도 계속" }
      - { title: "결과 알림", text: "확인 링크 ·\n전화 기록" }
    note:
      title: "금액이 조금이라도 오르면 다시 물어봐요"
      text: "카드 번호 · 비밀번호는 휴대폰에서 암호화되어 금고에 · AI에게는 전달되지 않아요"

  - type: compare
    tag: 비교
    title: 피클 vs Aside
    columns:
      - title: 피클
        items: ["**휴대폰 앱**", "전화 · 예약 · 생활 업무", "피클 서버의 전용 브라우저", "만 16세(약관) · 18세(도움말) 이상"]
      - title: Aside
        items: ["**컴퓨터 브라우저**", "조사 · 파일 정리 · 업무 반복", "내 컴퓨터의 브라우저", "13세 이상"]
    note:
      title: "생활 업무는 피클, 컴퓨터 업무는 Aside"
      text: "둘 다 학교 행정 시스템과 학생 정보에는 쓰지 않아요"

  - type: table
    tag: 화면
    title: 아래 탭 네 개 + 왼쪽 메뉴
    head: ["탭 · 메뉴", "하는 일"]
    rows:
      - ["💬 Chat", "피클과 채팅 · 음성 통화 · 일 맡기기"]
      - ["🧭 Explore", "추천 카드로 바로 맡기기"]
      - ["📦 Archive", "주고받은 파일 · 사진 모아 보기"]
      - ["👤 My Pickle", "요금제 · 연결 · 결제 수단 · Privacy · 알림"]
      - ["☰ 메뉴", "친구 · **다른 대화**(피클끼리 대화 · 전화 기록) · 검색"]
    note:
      title: "위쪽 내 피클 그림을 누르면"
      text: "맡긴 일(Tasks) · 예약된 작업(Scheduled) · 기억(Bubbles)"

  - type: section
    part: 2부
    title: "시작하고,\n일 맡기기"
    lead: 안전 설정 먼저, 결제 전에 멈추기
    items: ["실습① 안전 설정", "실습② 기차 시간 찾기", "실습③ 확인 카드 거절", "실습④ 협의 시간 맞추기"]
    image: /images/pickle-agent/slides/approve.jpg

  - type: steps
    tag: 실습 ①
    title: 설치하고 안전하게 설정하기 (10분)
    steps:
      - { title: "앱스토어에서 설치", text: "모르는 초대 링크로\n가입하지 않기" }
      - { title: "요금제 카드", text: "My Pickle 맨 위\n주간 사용량" }
      - { title: "Privacy", text: "친구에게는\n공개 프로필만(기본)" }
      - { title: "Keep access for", text: "카드 · 계정 사용 기간\n1~30일" }
    note:
      title: "요금: 도움말은 요금제(Plus · Pro · Max · Ultra) 필요, 매주 다시 채워져요"
      text: "국내 보도: 한국 계정은 초대받은 사람에게 무료로 먼저 · 앱의 요금제 카드에서 확인"

  - type: prompt
    tag: 실습 ②
    title: 출장 기차 시간 찾기 — 예매 전에 멈추기
    label: 출장 기차 시간 찾기
    text: |
      다음 주 수요일 오후 2시쯤 동대구역에서 서울역으로 가는 KTX를
      출발 시간이 빠른 순서로 3개 찾아서 출발·도착 시간과 일반실 요금을 알려 줘.
      예매는 하지 말고 알려만 줘.

  - type: list
    tag: 실습 ②
    title: 작업 카드로 지켜보고, 말로 고치기
    items:
      - { title: "작업 카드 누르기", text: "진행 상황 · 앱을 닫아도 계속" }
      - { title: "말로 고치기", text: "“오후 3시 이후로 바꿔 줘” → 이어서 고침" }
      - { title: "그만두기", text: "작업 카드 › ⋯ › Cancel task" }
      - { title: "끝난 단계는 그대로", text: "이미 한 예약 · 결제는 되돌아가지 않아요" }

  - type: prompt
    tag: 실습 ③
    title: 확인 카드 읽고 '거절' 눌러 보기
    label: 확인 카드 연습
    text: |
      교실에서 쓸 A4 복사용지 1박스를 온라인에서 가장 싸게 살 수 있는 곳을 찾아서
      주문하기 직전 확인 카드까지만 보여 줘.

  - type: prompt
    tag: 실습 ④
    title: 짝 선생님과 협의 시간 맞추기
    label: 친구 피클과 약속 잡기
    text: |
      ○○ 선생님 피클과 이야기해서 다음 주 화·수·목 중
      방과 후 3시 30분 이후에 30분 동안 학년 협의를 할 수 있는 시간을 맞춰 줘.
      정해지면 나한테 먼저 알려 줘.

  - type: list
    tag: 더 해 보기
    title: 반복 작업과 대신 전화
    image: /images/pickle-agent/slides/friends.jpg
    items:
      - { title: "예약된 작업", text: "“평일 아침 7시 30분에 날씨 · 미세먼지 알려 줘”" }
      - { title: "Scheduled 에서 관리", text: "멈추기 · 고치기 · 지우기 (돌 때마다 사용량)" }
      - { title: "대신 전화 (강사 시연)", text: "회사 번호로 걸고 AI 비서 · 기록됨을 밝혀요" }
      - { title: "전화 기록", text: "메뉴 › 다른 대화(Other chats)" }
    note:
      title: "전화를 걸게 한 책임은 맡긴 사람에게"
      text: "같은 곳에 여러 명이 반복 전화 걸게 하지 않기"

  - type: section
    part: 3부
    title: "안전하게 ·\n함께 생각하기"
    lead: 편리함과 책임은 함께 와요
    items: ["안전하게 쓰는 일곱 가지", "AI가 전화한다면?", "내일 해 볼 일"]
    image: /images/covers/pickle-agent.jpg

  - type: list
    tag: 안전하게
    title: 안전하게 쓰는 일곱 가지
    items:
      - { title: "학생은 쓸 수 없어요", text: "만 16세 · 18세 이상" }
      - { title: "학교 업무 계정은 연결 X", text: "연결하면 넓게 읽고 기억해요" }
      - { title: "학생 · 학부모 정보 X", text: "대화는 AI 회사로 · 직원 열람 가능(기록됨)" }
      - { title: "확인 카드는 끝까지 읽기", text: "날짜 · 금액 · 인원" }
      - { title: "AI가 한 말은 다시 확인", text: "예약 확정은 직접" }
      - { title: "받는 사람 생각하기", text: "반복 전화 X" }
      - { title: "접근 기록 보기", text: "Connections › 암호화 배너 › Activity" }

  - type: quiz
    tag: 퀴즈
    title: "결제 화면 금액이 승인한 것보다 3천 원 올랐다면?"
    options:
      - { label: A, title: "그대로 결제해요", text: "조금이라 괜찮아요" }
      - { label: B, title: "차이를 알려 주고\n다시 물어봐요", text: "작은 차이라도" }
    answer:
      title: "B — 금액이 조금이라도 오르면 다시 확인해요"
      text: "배송비 · 수수료가 붙어도 차이를 먼저 보여 줘요 · 팁처럼 내가 정할 금액은 피클이 정하지 않아요"

  - type: break
    title: "AI가 나 대신 전화한다면,\nAI라고 밝혀야 할까요?"
    text: "편해지는 일과 사람이 직접 해야 하는 일 · 학생들에게 무엇을 가르쳐 둘까요?"
